<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body {
            background-color: #111a11; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 420px; height: 100vh; max-height: 800px;
            background: #223322; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* スタート画面 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2c5e3b, #1e3f20);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; z-index: 999;
        }
        .title-box {
            text-align: center; margin-bottom: 40px; color: #fff;
            text-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }
        .title-box h1 { font-size: 28px; color: #ffd700; margin-bottom: 10px; line-height: 1.3; }
        .title-box p { font-size: 13px; letter-spacing: 1px; color: #a8e6cf; }

        .massive-btn {
            width: 85%; padding: 18px; background: linear-gradient(180deg, #ffe600, #ff8800);
            border: 3px solid #ffffff; border-radius: 40px; color: #1a0000; font-size: 22px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); cursor: pointer; text-align: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6); outline: none; -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .massive-btn:active { transform: scale(0.96); filter: brightness(0.9); }

        /* トップバー */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; height: 40px;
            background: rgba(20, 35, 20, 0.85); border: 2px solid #ffd700; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
            color: #ffffff; font-size: 13px; font-weight: bold; z-index: 20;
        }
        .bgm-btn {
            background: linear-gradient(180deg, #444, #222); border: 1.5px solid #ffd700; color: #ffd700;
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            outline: none; font-family: inherit;
        }
        .bgm-btn.active { background: linear-gradient(180deg, #ff8800, #cc5500); color: #fff; }

        canvas { width: 100%; height: 100%; display: block; z-index: 10; }

        /* スコアエリア */
        #mid-score-board {
            position: absolute; bottom: 88px; left: 12px; right: 12px;
            background: rgba(15, 25, 15, 0.85); border: 2px solid #ffd700; border-radius: 14px;
            display: none; justify-content: space-around; align-items: center; padding: 8px 0;
            color: #ffffff; font-size: 15px; font-weight: bold; z-index: 40;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 操作ボタン */
        #controls {
            position: absolute; bottom: 18px; left: 12px; right: 12px; display: none;
            justify-content: space-between; gap: 8px; z-index: 40;
        }
        .ctrl-btn {
            flex: 1; padding: 14px 0; background: linear-gradient(180deg, #a06836, #5c3818);
            border: 2px solid #ffd700; border-radius: 16px; color: #ffffff; font-weight: bold;
            font-size: 16px; text-align: center; box-shadow: 0 5px 12px rgba(0,0,0,0.5);
            cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; font-family: inherit;
        }
        .ctrl-btn:active { background: #5c3818; transform: translateY(2px); }

        /* 結果画面 */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 20, 10, 0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; z-index: 999;
        }
        .result-board {
            background: rgba(20, 30, 20, 0.92); border: 3px solid #ffd700; border-radius: 20px;
            padding: 20px; width: 88%; text-align: center; color: #ffffff; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #version-tag { position: absolute; top: 60px; left: 14px; color: #ffd700; font-size: 11px; z-index: 999; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="version-tag">v24 STABLE</div>

    <div id="start-screen">
        <div class="title-box">
            <h1>黄金ドングリを<br>集め出せ！</h1>
            <p>STAMPEDE 100: COLLECT THE ACORNS</p>
        </div>
        <button class="massive-btn" id="startBtn">ゲームスタート！</button>
    </div>

    <div id="top-bar">
        <div>黄金ドングリ回収作戦</div>
        <button id="bgmToggleBtn" class="bgm-btn active">🎵 BGM: ON</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mid-score-board">
        <div>ドングリ: <span id="score" style="color:#ffd700; font-size:20px;">0</span></div>
        <div>最高記録: <span id="high-score" style="color:#ffffff; font-size:18px;">0</span></div>
    </div>

    <div id="controls">
        <button class="ctrl-btn" id="leftBtn">◀ 左</button>
        <button class="ctrl-btn" id="jumpBtn">▲ ジャンプ</button>
        <button class="ctrl-btn" id="rightBtn">右 ▶</button>
    </div>

    <div id="result-screen">
        <div class="result-board">
            <div style="font-size: 22px; color: #ffd700; font-weight: bold; margin-bottom: 10px;">🏆 結果発表 🏆</div>
            <p style="font-size:15px; margin-bottom: 10px;">押収ドングリ: <span id="res-score" style="font-size:28px; color:#ffd700; font-weight:bold;">0</span> 個</p>
            <div id="res-rank" style="font-size: 45px; color: #ff3333; font-weight: bold; margin: 5px 0;">S</div>
            <p style="font-size: 12px; color: #ffdddd; background: rgba(255,0,0,0.3); padding: 5px; border-radius: 6px; font-weight:bold; margin-top:10px;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <button class="massive-btn" id="restartBtn" style="width:88%;">もう一度走る！</button>
    </div>
</div>

<script>
    var D = document;
    var canvas = D.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    var isPlaying = false;
    var loopRunning = false;
    var score = 0;
    var highScore = 0;
    try {
        highScore = localStorage.getItem('acorn_highscore_v24') || 0;
    } catch(e) {}
    D.getElementById('high-score').innerText = highScore;

    var lanes = [100, 200, 300];
    var currentLane = 1;
    var playerX = 200;
    var playerY = 410;
    var targetX = 200;
    var isJumping = false;
    var jumpY = 0;
    var jumpV = 0;
    var objects = [];
    var speed = 7.5;
    var bgY = 0;
    var isBgmOn = true;
    var speedUpNotifyTimer = 0;
    var audioCtx = null;
    var bgmTimer = null;

    function safeInitAudio() {
        try {
            if (!audioCtx) {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch(e) {}
    }

    function playAcornSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sine';
            var t = audioCtx.currentTime;
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.setValueAtTime(1200, t + 0.05);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.2);
        } catch(e) {}
    }

    function playHitSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            var t = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(10, t + 0.4);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.4);
        } catch(e) {}
    }

    function initBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        var notes = [329.63, 392.00, 440.00, 523.25, 587.33, 523.25, 440.00, 392.00];
        var step = 0;
        bgmTimer = setInterval(function() {
            if (!isPlaying || !isBgmOn || !audioCtx) return;
            try {
                var t = audioCtx.currentTime;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = notes[step % notes.length];
                gain.gain.setValueAtTime(0.03, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.12);
                step++;
            } catch(e) {}
        }, 135);
    }

    function startGame(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        safeInitAudio();

        // 画面の切り替えを確実に行う
        D.getElementById('start-screen').style.display = 'none';
        D.getElementById('result-screen').style.display = 'none';
        D.getElementById('controls').style.display = 'flex';
        D.getElementById('mid-score-board').style.display = 'flex';

        isPlaying = true;
        score = 0;
        speed = 7.5;
        currentLane = 1;
        targetX = lanes[currentLane];
        playerX = targetX;
        objects = [];
        D.getElementById('score').innerText = score;

        initBGM();

        if (!loopRunning) {
            loopRunning = true;
            requestAnimationFrame(gameLoop);
        }
    }

    function moveLane(dir) {
        if (!isPlaying) return;
        currentLane += dir;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        targetX = lanes[currentLane];
    }

    function jumpAction() {
        if (isPlaying && !isJumping) {
            isJumping = true;
            jumpV = -16;
        }
    }

    function endGame() {
        isPlaying = false;
        loopRunning = false;
        if (bgmTimer) clearInterval(bgmTimer);
        playHitSE();

        if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('acorn_highscore_v24', highScore); } catch(e) {}
            D.getElementById('high-score').innerText = highScore;
        }

        D.getElementById('res-score').innerText = score;
        var rank = score >= 300 ? 'S' : score >= 200 ? 'A' : score >= 100 ? 'B' : 'C';
        D.getElementById('res-rank').innerText = rank;

        D.getElementById('controls').style.display = 'none';
        D.getElementById('mid-score-board').style.display = 'none';
        D.getElementById('result-screen').style.display = 'flex';
    }

    var timer = 0;
    function gameLoop() {
        if (!isPlaying) return;

        playerX += (targetX - playerX) * 0.35;
        if (isJumping) {
            jumpY += jumpV;
            jumpV += 0.95;
            if (jumpY >= 0) { jumpY = 0; isJumping = false; }
        }

        bgY = (bgY + speed) % 100;
        timer++;
        if (timer > 22) {
            var lane = Math.floor(Math.random() * 3);
            var isEnemy = Math.random() < 0.45;
            objects.push({ x: lanes[lane], y: -60, enemy: isEnemy });
            timer = 0;
            speed += 0.008;
        }

        // 描画処理
        ctx.fillStyle = '#2d5026'; ctx.fillRect(0, 0, 400, 700);
        ctx.fillStyle = '#9e744a'; ctx.fillRect(50, 0, 300, 700);
        ctx.strokeStyle = '#dca868'; ctx.lineWidth = 4; ctx.strokeRect(50, 0, 300, 700);

        ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.setLineDash([25, 25]); ctx.lineDashOffset = -bgY;
        ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 700); ctx.moveTo(250, 0); ctx.lineTo(250, 700); ctx.stroke();
        ctx.setLineDash([]);

        for (var i = objects.length - 1; i >= 0; i--) {
            var o = objects[i];
            o.y += speed;

            var dx = Math.abs(playerX - o.x);
            var dy = Math.abs((playerY + jumpY) - o.y);
            
            if (dx < 40 && dy < 40) {
                if (o.enemy) {
                    if (jumpY > -20) { endGame(); return; }
                } else {
                    score += 10;
                    D.getElementById('score').innerText = score;
                    playAcornSE();
                    objects.splice(i, 1);
                    continue;
                }
            }

            // オブジェクト描画（画像エラー回避用フォールバック）
            if (o.enemy) {
                ctx.fillStyle = '#607d8b'; ctx.beginPath(); ctx.arc(o.x, o.y, 24, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#d32f2f'; ctx.fillRect(o.x - 16, o.y - 6, 32, 12);
            } else {
                ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(o.x, o.y, 16, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(o.x, o.y - 12, 8, 0, Math.PI * 2); ctx.fill();
            }
            if (o.y > 780) objects.splice(i, 1);
        }

        // プレイヤー描画（猪に乗ったおばあちゃん風）
        var pDrawY = playerY + jumpY;
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 50, 40, 10, 0, 0, 6.28); ctx.fill();
        
        // 猪の体
        ctx.fillStyle = '#8d5524'; ctx.beginPath(); ctx.ellipse(playerX, pDrawY, 35, 25, 0, 0, Math.PI * 2); ctx.fill();
        // おばあちゃん
        ctx.fillStyle = '#ffccaa'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 30, 20, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e0e0e0'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 38, 14, 0, Math.PI * 2); ctx.fill();

        if (isPlaying) requestAnimationFrame(gameLoop);
    }

    // イベント登録
    var startBtn = D.getElementById('startBtn');
    var restartBtn = D.getElementById('restartBtn');

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', startGame);
    restartBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('touchend', startGame);

    D.getElementById('bgmToggleBtn').addEventListener('click', function() {
        isBgmOn = !isBgmOn;
        safeInitAudio();
        this.innerText = isBgmOn ? "🎵 BGM: ON" : "🔇 BGM: OFF";
        this.className = isBgmOn ? "bgm-btn active" : "bgm-btn";
    });

    D.getElementById('leftBtn').addEventListener('click', function() { moveLane(-1); });
    D.getElementById('jumpBtn').addEventListener('click', jumpAction);
    D.getElementById('rightBtn').addEventListener('click', function() { moveLane(1); });
</script>
</body>
</html>
