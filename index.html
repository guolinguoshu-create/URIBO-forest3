<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: #1e2618;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 8px;
        }

        /* サウンド切替ボタン */
        #sound-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffd700;
            color: #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* トップ（スタート）画面 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 80px;
            z-index: 25;
        }
        #start-btn {
            width: 80%;
            padding: 18px;
            background: linear-gradient(180deg, #ffdd00, #ff8800);
            border: 3px solid #ffffff;
            border-radius: 35px;
            color: #000;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* スコアヘッダー */
        #top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 60px;
            height: 44px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffd700;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            z-index: 10;
        }
        .score-text { color: #ffd700; font-size: 16px; }

        /* キャンバス */
        canvas { width: 100%; height: 100%; display: block; }

        /* 操作ボタン */
        #controls {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
        }
        .btn {
            flex: 1;
            padding: 14px 0;
            background: linear-gradient(180deg, #8b5a2b, #5c3a17);
            border: 2px solid #ffd700;
            border-radius: 25px;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active {
            transform: translateY(2px);
            background: linear-gradient(180deg, #5c3a17, #3a240e);
        }

        /* 結果発表画面 */
        #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px;
            z-index: 20;
        }
        .result-board {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .result-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .rank-badge {
            font-size: 44px;
            color: #ff4444;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
        }
        #restart-btn {
            width: 85%;
            padding: 16px;
            background: linear-gradient(180deg, #ffcc00, #ff8800);
            border: 3px solid #ffffff;
            border-radius: 30px;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- サウンドボタン -->
    <button id="sound-btn" onclick="toggleSound()">🔊</button>

    <!-- スタート画面 -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">スタート！</button>
    </div>

    <!-- UIバー -->
    <div id="top-bar">
        <div>黄金ドングリ: <span id="score" class="score-text">0</span> 個</div>
        <div>最高: <span id="high-score">0</span></div>
    </div>

    <!-- ゲーム画面 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 操作ボタン -->
    <div id="controls">
        <div class="btn" id="btn-left">◀ 左</div>
        <div class="btn" id="btn-jump">▲ ジャンプ</div>
        <div class="btn" id="btn-right">右 ▶</div>
    </div>

    <!-- 結果発表画面 -->
    <div id="result-screen">
        <div class="result-board">
            <div class="result-title">【 結 果 発 表 】</div>
            <p>押収された黄金ドングリ</p>
            <div style="font-size: 24px; color: #ffd700; margin: 8px 0;"><span id="res-score">0</span> 個</div>
            <p>評価ランク</p>
            <div id="res-rank" class="rank-badge">S</div>
            <p style="font-size: 11px; margin-top: 8px; color: #aaa;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <button id="restart-btn" onclick="resetGame()">もう一度走る！</button>
    </div>
</div>

<script>
    // ==========================================
    // 🖼️ GitHubのリポジトリ内にある実際のファイル名
    // GitHubのスクショに映っている名前に合わせて変更してください
    // ==========================================
    const IMAGES = {
        // ① トップ画面（スタート画面）の画像ファイル名
        titleBg: '1768702691552.png', 

        // ② ゲーム内のおばあちゃん＆ウリボ後ろ姿（透過画像）のファイル名
        player: '1768793217913.png', 

        // ③ 結果発表（警察＆どんぐり背景）のファイル名
        resultBg: '1768790264451.png'  
    };

    // ==========================================
    // 🎵 Web Audio APIによるBGM＆効果音システム（ファイル不要！）
    // ==========================================
    class SoundManager {
        constructor() {
            this.ctx = null;
            this.bgmTimer = null;
            this.muted = false;
            this.step = 0;
        }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playTone(freq, type, duration, vol=0.1) {
            if (!this.ctx || this.muted) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e){}
        }
        playJump() {
            if (!this.ctx || this.muted) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            } catch(e){}
        }
        playCoin() {
            this.playTone(987.77, 'sine', 0.08, 0.15); // B5
            setTimeout(() => this.playTone(1318.51, 'sine', 0.15, 0.15), 60); // E6
        }
        playGameOver() {
            this.stopBGM();
            this.playTone(400, 'sawtooth', 0.2, 0.2);
            setTimeout(() => this.playTone(350, 'sawtooth', 0.2, 0.2), 150);
            setTimeout(() => this.playTone(300, 'sawtooth', 0.2, 0.2), 300);
            setTimeout(() => this.playTone(220, 'sawtooth', 0.5, 0.2), 450);
        }
        startBGM() {
            this.init();
            if (this.bgmTimer) clearInterval(this.bgmTimer);
            const notes = [261, 329, 392, 523, 293, 349, 440, 587, 329, 392, 493, 659, 392, 329, 261, 196];
            this.step = 0;
            this.bgmTimer = setInterval(() => {
                if (this.muted) return;
                const note = notes[this.step % notes.length];
                this.playTone(note, 'triangle', 0.12, 0.06);
                if (this.step % 2 === 0) {
                    this.playTone(130, 'sine', 0.1, 0.08);
                }
                this.step++;
            }, 170);
        }
        stopBGM() {
            if (this.bgmTimer) {
                clearInterval(this.bgmTimer);
                this.bgmTimer = null;
            }
        }
    }

    const sound = new SoundManager();

    function toggleSound() {
        sound.muted = !sound.muted;
        document.getElementById('sound-btn').textContent = sound.muted ? '🔇' : '🔊';
    }

    // ==========================================
    // ゲーム本体設定
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 400;
    canvas.height = 700;

    // 画像読み込み
    const titleImg = new Image(); titleImg.src = IMAGES.titleBg;
    const playerImg = new Image(); playerImg.src = IMAGES.player;
    const resultBgImg = new Image(); resultBgImg.src = IMAGES.resultBg;

    // スタート画面に背景画像を設定
    document.getElementById('start-screen').style.backgroundImage = `url('${IMAGES.titleBg}')`;

    let score = 0;
    let highScore = localStorage.getItem('acorn_highscore') || 0;
    document.getElementById('high-score').textContent = highScore;
    let isGameOver = false;
    let isPlaying = false;

    const lanes = [100, 200, 300];
    let currentLane = 1;
    let targetX = lanes[currentLane];
    let playerX = targetX;
    let playerY = 530;

    let isJumping = false;
    let jumpOffsetY = 0;
    let jumpVelocity = 0;
    const gravity = 0.85;

    let objects = [];
    let speed = 7;
    let spawnTimer = 0;
    let bgOffset = 0;

    // 入力設定
    document.getElementById('btn-left').addEventListener('click', () => moveLane(-1));
    document.getElementById('btn-right').addEventListener('click', () => moveLane(1));
    document.getElementById('btn-jump').addEventListener('click', jump);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') moveLane(-1);
        if (e.key === 'ArrowRight') moveLane(1);
        if (e.key === 'ArrowUp' || e.key === ' ') jump();
    });

    function moveLane(dir) {
        if (!isPlaying || isGameOver) return;
        currentLane = Math.max(0, Math.min(2, currentLane + dir));
        targetX = lanes[currentLane];
    }

    function jump() {
        if (isPlaying && !isJumping && !isGameOver) {
            isJumping = true;
            jumpVelocity = -15;
            sound.playJump();
        }
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        isPlaying = true;
        sound.startBGM();
        gameLoop();
    }

    function spawnObject() {
        const lane = Math.floor(Math.random() * 3);
        const isObstacle = Math.random() < 0.35;
        objects.push({
            x: lanes[lane],
            y: -50,
            type: isObstacle ? 'rock' : 'acorn'
        });
    }

    function update() {
        if (!isPlaying || isGameOver) return;

        playerX += (targetX - playerX) * 0.25;

        if (isJumping) {
            jumpOffsetY += jumpVelocity;
            jumpVelocity += gravity;
            if (jumpOffsetY >= 0) {
                jumpOffsetY = 0;
                isJumping = false;
            }
        }

        bgOffset = (bgOffset + speed) % 40;

        spawnTimer++;
        if (spawnTimer > 30) {
            spawnObject();
            spawnTimer = 0;
            speed += 0.003;
        }

        for (let i = objects.length - 1; i >= 0; i--) {
            let obj = objects[i];
            obj.y += speed;

            let dx = Math.abs(playerX - obj.x);
            let dy = Math.abs((playerY + jumpOffsetY) - obj.y);

            if (dx < 32 && dy < 38) {
                if (obj.type === 'acorn') {
                    score += 10;
                    document.getElementById('score').textContent = score;
                    sound.playCoin();
                    objects.splice(i, 1);
                    continue;
                } else if (obj.type === 'rock') {
                    if (jumpOffsetY > -25) {
                        endGame();
                        return;
                    }
                }
            }

            if (obj.y > canvas.height + 50) {
                objects.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景
        ctx.fillStyle = '#2d3725';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#5a4332';
        ctx.fillRect(50, 0, 300, canvas.height);

        ctx.strokeStyle = '#8d7052';
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -bgOffset;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(150, 0); ctx.lineTo(150, canvas.height);
        ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // ドングリ＆障害物
        objects.forEach(obj => {
            if (obj.type === 'acorn') {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            } else {
                ctx.fillStyle = '#6c7a89';
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#34495e';
                ctx.fillRect(obj.x - 16, obj.y - 6, 32, 12);
            }
        });

        // プレイヤー描画
        const drawY = playerY + jumpOffsetY;

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(playerX, playerY + 40, 28, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        if (playerImg.complete && playerImg.naturalWidth !== 0) {
            const w = 140;
            const h = 170;
            ctx.drawImage(playerImg, playerX - w/2, drawY - h/2, w, h);
        } else {
            // 画像未読み込み時の予備表示
            ctx.fillStyle = '#d35400';
            ctx.beginPath();
            ctx.arc(playerX, drawY, 26, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function gameLoop() {
        update();
        draw();
        if (isPlaying && !isGameOver) {
            requestAnimationFrame(gameLoop);
        }
    }

    function endGame() {
        isGameOver = true;
        sound.playGameOver();

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('acorn_highscore', highScore);
            document.getElementById('high-score').textContent = highScore;
        }

        let rank = 'C';
        if (score >= 300) rank = 'S';
        else if (score >= 200) rank = 'A';
        else if (score >= 100) rank = 'B';

        document.getElementById('res-score').textContent = score;
        document.getElementById('res-rank').textContent = rank;

        const resultScreen = document.getElementById('result-screen');
        resultScreen.style.backgroundImage = `url('${IMAGES.resultBg}')`;
        resultScreen.style.display = 'flex';
    }

    function resetGame() {
        score = 0;
        speed = 7;
        currentLane = 1;
        targetX = lanes[1];
        playerX = targetX;
        objects = [];
        isGameOver = false;
        document.getElementById('score').textContent = 0;
        document.getElementById('result-screen').style.display = 'none';
        sound.startBGM();
        gameLoop();
    }
</script>
</body>
</html>
