<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        html, body {
            background-color: #111a11; display: flex; justify-content: center; align-items: center;
            height: 100%; height: 100dvh; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden;
            overscroll-behavior-y: none;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 420px; 
            height: 100%; height: 100dvh; max-height: 800px;
            background: #223322; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* スタート画面 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #223322;
            background-image: url('1788702691552.png');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: 12dvh; z-index: 99999; cursor: pointer;
        }
        .massive-btn {
            width: 85%; padding: 18px; background: linear-gradient(180deg, #ffe600, #ff8800);
            border: 3px solid #ffffff; border-radius: 40px; color: #1a0000; font-size: 22px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 100000; cursor: pointer; text-align: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6); outline: none; -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .tap-msg {
            margin-top: 15px; color: #ffffff; font-size: 13px; font-weight: bold; 
            text-shadow: 1px 1px 3px #000; animation: blink 1.5s infinite; pointer-events: none;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* トップバー */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; height: 40px;
            background: rgba(20, 35, 20, 0.85); border: 2px solid #ffd700; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
            color: #ffffff; font-size: 13px; font-weight: bold; z-index: 20;
        }
        .bgm-btn {
            background: linear-gradient(180deg, #444, #222); border: 1.5px solid #ffd700; color: #ffd700;
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            outline: none; font-family: inherit;
        }
        .bgm-btn.active { background: linear-gradient(180deg, #ff8800, #cc5500); color: #fff; }

        canvas { width: 100%; height: 100%; display: block; z-index: 10; }

        /* スコアエリア */
        #mid-score-board {
            position: absolute; bottom: 120px; left: 16px; right: 16px;
            background: rgba(15, 25, 15, 0.9); border: 2px solid #ffd700; border-radius: 14px;
            display: none; justify-content: space-around; align-items: center; padding: 10px 0;
            color: #ffffff; font-size: 15px; font-weight: bold; z-index: 40;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 操作ボタン */
        #controls {
            position: absolute; bottom: 40px; left: 16px; right: 16px; display: none;
            justify-content: space-between; gap: 12px; z-index: 40;
        }
        .ctrl-btn {
            flex: 1; padding: 16px 0; background: linear-gradient(180deg, #a06836, #5c3818);
            border: 2px solid #ffd700; border-radius: 16px; color: #ffffff; font-weight: bold;
            font-size: 18px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; font-family: inherit;
        }
        .ctrl-btn:active { background: #5c3818; transform: translateY(2px); }

        /* 結果発表画面 */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #223322;
            background-image: url('1788793217973.png');
            background-size: cover; background-position: center;
            display: none; flex-direction: column; justify-content: flex-start; align-items: center;
            padding-top: 45px; z-index: 99999;
        }
        #result-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25); z-index: 1;
        }
        .result-board {
            position: relative; background: rgba(20, 30, 20, 0.92); border: 3px solid #ffd700; border-radius: 20px;
            padding: 18px 16px; width: 88%; text-align: center; color: #ffffff; margin-bottom: 20px; z-index: 2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(3px);
        }
        #version-tag { position: absolute; top: 60px; left: 14px; color: #ffd700; font-size: 11px; z-index: 100000; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="version-tag">v35 ULTIMATE</div>

    <div id="start-screen">
        <button class="massive-btn">ゲームスタート！</button>
        <p class="tap-msg">▼ 画面のどこをタップしてもスタートします ▼</p>
    </div>

    <div id="top-bar">
        <div>黄金ドングリ回収作戦</div>
        <button id="bgmToggleBtn" class="bgm-btn active">🎵 BGM: ON</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mid-score-board">
        <div>ドングリ: <span id="score" style="color:#ffd700; font-size:20px;">0</span></div>
        <div>最高記録: <span id="high-score" style="color:#ffffff; font-size:18px;">0</span></div>
    </div>

    <div id="controls">
        <button id="leftBtn" class="ctrl-btn">◀ 左</button>
        <button id="jumpBtn" class="ctrl-btn">▲ ジャンプ</button>
        <button id="rightBtn" class="ctrl-btn">右 ▶</button>
    </div>

    <div id="result-screen">
        <div class="result-board">
            <div style="font-size: 22px; color: #ffd700; font-weight: bold; text-shadow: 1px 1px 3px #000;">🏆 栄光の表彰式 🏆</div>
            <p style="margin-top:8px; font-size:15px;">押収ドングリ: <span id="res-score" style="font-size:30px; color:#ffd700; font-weight:bold;">0</span> 個</p>
            <div id="res-rank" style="font-size: 50px; color: #ff3333; font-weight: bold; margin: 2px 0; text-shadow: 2px 2px 0 #000;">S</div>
            <p style="font-size: 12px; color: #ffdddd; background: rgba(255,0,0,0.3); padding: 5px; border-radius: 6px; font-weight:bold;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <button id="restartBtn" class="massive-btn" style="position:relative; z-index:100000; width:88%;">もう一度走る！</button>
    </div>
</div>

<script>
    var D = document;
    var canvas = D.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    var isPlaying = false;
    var loopRunning = false;
    var score = 0;
    var highScore = 0;
    try {
        highScore = localStorage.getItem('acorn_highscore_v35') || 0;
    } catch(e) {}
    D.getElementById('high-score').innerText = highScore;

    var lanes = [100, 200, 300];
    var currentLane = 1;
    var playerX = 200;
    var playerY = 410;
    var targetX = 200;
    var isJumping = false;
    var jumpY = 0;
    var jumpV = 0;
    var objects = [];
    var speed = 7.5;
    var bgY = 0;
    var isBgmOn = true;
    var speedUpNotifyTimer = 0;

    var audioCtx = null;
    var bgmTimer = null;

    function safeInitAudio() {
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
    }

    function playHitSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            var time = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(10, time + 0.4);
            gain.gain.setValueAtTime(0.25, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.4);
        } catch(e) {}
    }

    function playAcornSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sine';
            var time = audioCtx.currentTime;
            osc.frequency.setValueAtTime(880, time);
            osc.frequency.setValueAtTime(1200, time + 0.05);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.2);
        } catch(e) {}
    }

    function playResultFanfare() {
        if (!isBgmOn || !audioCtx) return;
        if (bgmTimer) clearInterval(bgmTimer);
        try {
            var time = audioCtx.currentTime;
            var melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            var duration = [0.2, 0.2, 0.2, 0.4, 0.2, 0.8];
            var offset = 0;
            for (var i = 0; i < melody.length; i++) {
                var freq = melody[i];
                var dur = duration[i];
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, time + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, time + offset + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time + offset); osc.stop(time + offset + dur);
                offset += dur;
            }
        } catch(e) {}
    }

    function initBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        var notes = [329.63, 392.00, 440.00, 523.25, 587.33, 523.25, 440.00, 392.00, 440.00, 523.25, 659.25, 587.33];
        var step = 0;
        bgmTimer = setInterval(function() {
            if (!isPlaying || !isBgmOn || !audioCtx) return;
            try {
                var time = audioCtx.currentTime;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = notes[step % notes.length];
                gain.gain.setValueAtTime(0.03, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 0.12);
                step++;
            } catch(e) {}
        }, 135);
    }

    function toggleBGM() {
        isBgmOn = !isBgmOn;
        safeInitAudio();
        var btn = D.getElementById('bgmToggleBtn');
        btn.innerText = isBgmOn ? "🎵 BGM: ON" : "🔇 BGM: OFF";
        btn.className = isBgmOn ? "bgm-btn active" : "bgm-btn";
    }

    var imgPlayer = new Image(); imgPlayer.src = '1788793264451.png';
    var imgAcorn = new Image(); imgAcorn.src = 'image.png';

    function startGameForce() {
        safeInitAudio();
        isPlaying = true;

        D.getElementById('start-screen').style.display = 'none';
        D.getElementById('result-screen').style.display = 'none';
        D.getElementById('controls').style.display = 'flex';
        D.getElementById('mid-score-board').style.display = 'flex';

        score = 0;
        speed = 7.5;
        speedUpNotifyTimer = 0;
        currentLane = 1;
        targetX = lanes[currentLane];
        playerX = targetX;
        objects = [];
        D.getElementById('score').innerText = score;

        initBGM();

        if (!loopRunning) {
            loopRunning = true;
            requestAnimationFrame(gameLoop);
        }
    }

    function moveLane(dir) {
        if (!isPlaying) return;
        currentLane += dir;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        targetX = lanes[currentLane];
    }

    function jumpAction() {
        if (isPlaying && !isJumping) {
            isJumping = true;
            jumpV = -16;
        }
    }

    function endGame() {
        isPlaying = false;
        loopRunning = false;
        if (bgmTimer) clearInterval(bgmTimer);
        playHitSE();

        if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('acorn_highscore_v35', highScore); } catch(e) {}
            D.getElementById('high-score').innerText = highScore;
        }

        D.getElementById('res-score').innerText = score;
        var rank = score >= 300 ? 'S' : score >= 200 ? 'A' : score >= 100 ? 'B' : 'C';
        D.getElementById('res-rank').innerText = rank;

        D.getElementById('controls').style.display = 'none';
        D.getElementById('mid-score-board').style.display = 'none';
        D.getElementById('result-screen').style.display = 'flex';

        setTimeout(function() { playResultFanfare(); }, 150);
    }

    // すべての環境でボタンや画面タッチが確実に機能する登録処理
    function bindAction(id, func) {
        var el = D.getElementById(id);
        if (!el) return;
        el.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            func();
        });
    }

    bindAction('start-screen', startGameForce);
    bindAction('restartBtn', startGameForce);
    bindAction('bgmToggleBtn', toggleBGM);
    bindAction('leftBtn', function() { moveLane(-1); });
    bindAction('jumpBtn', jumpAction);
    bindAction('rightBtn', function() { moveLane(1); });

    window.addEventListener('keydown', function(e) {
        if (!isPlaying) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
        else if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
            jumpAction(); e.preventDefault();
        }
    });

    var timer = 0;
    var speedCounter = 0;
    function gameLoop() {
        if (!isPlaying) return;

        playerX += (targetX - playerX) * 0.35;
        if (isJumping) {
            jumpY += jumpV;
            jumpV += 0.95;
            if (jumpY >= 0) { jumpY = 0; isJumping = false; }
        }

        bgY = (bgY + speed) % 100;

        timer++;
        if (timer > 20) {
            var lane = Math.floor(Math.random() * 3);
            var isEnemy = Math.random() < 0.45;
            var enemyType = Math.floor(Math.random() * 3);
            objects.push({ x: lanes[lane], y: -60, enemy: isEnemy, type: enemyType });
            timer = 0;
            speed += 0.008;
            speedCounter++;
            if (speedCounter % 35 === 0) speedUpNotifyTimer = 40;
        }

        ctx.fillStyle = '#2d5026'; ctx.fillRect(0, 0, 400, 700);
        ctx.fillStyle = '#9e744a'; ctx.fillRect(50, 0, 300, 700);
        ctx.strokeStyle = '#dca868'; ctx.lineWidth = 4; ctx.strokeRect(50, 0, 300, 700);

        ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.setLineDash([25, 25]); ctx.lineDashOffset = -bgY;
        ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 700); ctx.moveTo(250, 0); ctx.lineTo(250, 700); ctx.stroke();
        ctx.setLineDash([]);

        for (var i = objects.length - 1; i >= 0; i--) {
            var o = objects[i];
            o.y += speed;

            var dx = Math.abs(playerX - o.x);
            var dy = Math.abs((playerY + jumpY) - o.y);
            
            if (dx < 42 && dy < 45) {
                if (o.enemy) {
                    if (jumpY > -20) { endGame(); return; }
                } else {
                    score += 10;
                    D.getElementById('score').innerText = score;
                    playAcornSE();
                    objects.splice(i, 1);
                    continue;
                }
            }

            if (o.enemy) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 20, 36, 10, 0, 0, 6.28); ctx.fill();
                if (o.type === 0) {
                    ctx.fillStyle = '#78909c'; ctx.beginPath(); ctx.arc(o.x, o.y, 28, 0, Math.PI * 2); ctx.fill();
                } else if (o.type === 1) {
                    ctx.fillStyle = '#b0bec5'; ctx.fillRect(o.x - 38, o.y - 12, 76, 24);
                } else {
                    ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(o.x, o.y, 26, 0, Math.PI * 2); ctx.fill();
                }
            } else {
                if (imgAcorn && imgAcorn.complete && imgAcorn.naturalWidth > 0) {
                    ctx.drawImage(imgAcorn, o.x - 22, o.y - 22, 44, 44);
                } else {
                    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(o.x, o.y, 15, 0, Math.PI * 2); ctx.fill();
                }
            }
            if (o.y > 780) objects.splice(i, 1);
        }

        var pDrawY = playerY + jumpY;
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 58, 48, 12, 0, 0, 6.28); ctx.fill();

        if (imgPlayer && imgPlayer.complete && imgPlayer.naturalWidth > 0) {
            ctx.drawImage(imgPlayer, playerX - 65, pDrawY - 70, 130, 115);
        } else {
            ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 20, 30, 0, Math.PI*2); ctx.fill();
        }

        if (speedUpNotifyTimer > 0) {
            speedUpNotifyTimer--;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.95)';
            ctx.font = '900 26px sans-serif';
            ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
            ctx.strokeText('⚡ SPEED UP! ⚡', 200, 260); ctx.fillText('⚡ SPEED UP! ⚡', 200, 260);
        }
        if (isPlaying) requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
