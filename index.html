<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黄金ドングリ回収作戦 - 逃走編</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body {
            background-color: #0b130b; display: flex; justify-content: center; align-items: center;
            height: 100%; height: 100dvh; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden;
            overscroll-behavior-y: none;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 420px; 
            height: 100%; height: 100dvh; max-height: 800px;
            background: #1b4d3e; box-shadow: 0 0 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* スタート画面：世界観を凝縮 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #224d38 0%, #0d2218 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 24px; z-index: 99999; text-align: center;
        }
        .wanted-badge {
            background: #ffd700; color: #1a0000; font-weight: 900; font-size: 12px;
            padding: 4px 14px; border-radius: 20px; margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(255,215,0,0.4); letter-spacing: 2px;
        }
        .title-logo {
            font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 3px 3px 0px #78350f, 0 0 20px rgba(255,215,0,0.5);
            margin-bottom: 8px; line-height: 1.3;
        }
        .title-sub {
            font-size: 13px; color: #a7f3d0; margin-bottom: 30px; font-weight: bold;
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 12px; border: 1px dashed #34d399;
        }
        .massive-btn {
            width: 88%; padding: 18px; background: linear-gradient(180deg, #fde047, #f59e0b);
            border: 3px solid #ffffff; border-radius: 40px; color: #451a03; font-size: 20px; font-weight: 900;
            box-shadow: 0 8px 25px rgba(245,158,11,0.5); z-index: 100000; cursor: pointer; text-align: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6); outline: none; -webkit-tap-highlight-color: transparent;
            font-family: inherit; touch-action: manipulation; transition: transform 0.1s;
        }
        .massive-btn:active { transform: scale(0.95); background: linear-gradient(180deg, #facc15, #d97706); }

        /* トップバー */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; height: 42px;
            background: rgba(15, 23, 15, 0.9); border: 2px solid #ffd700; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
            color: #ffffff; font-size: 13px; font-weight: bold; z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .bgm-btn {
            background: linear-gradient(180deg, #374151, #1f2937); border: 1.5px solid #ffd700; color: #ffd700;
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            outline: none; font-family: inherit; touch-action: manipulation;
        }
        .bgm-btn.active { background: linear-gradient(180deg, #d97706, #b45309); color: #fff; }

        canvas { width: 100%; height: 100%; display: block; z-index: 10; touch-action: none; }

        /* スコアボード */
        #mid-score-board {
            position: absolute; bottom: 120px; left: 16px; right: 16px;
            background: rgba(15, 23, 15, 0.92); border: 2px solid #ffd700; border-radius: 14px;
            display: none; justify-content: space-around; align-items: center; padding: 10px 0;
            color: #ffffff; font-size: 14px; font-weight: bold; z-index: 40;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        /* 操作ボタン */
        #controls {
            position: absolute; bottom: 35px; left: 16px; right: 16px; display: none;
            justify-content: space-between; gap: 12px; z-index: 40;
        }
        .ctrl-btn {
            flex: 1; padding: 16px 0; background: linear-gradient(180deg, #9a3412, #7c2d12);
            border: 2px solid #ffd700; border-radius: 16px; color: #ffffff; font-weight: bold;
            font-size: 17px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; font-family: inherit;
            touch-action: manipulation;
        }
        .ctrl-btn:active { background: #7c2d12; transform: translateY(2px); }

        /* 結果画面（表彰式・裁判モード） */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #224d38 0%, #0d2218 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; z-index: 99999; text-align: center;
        }
        .result-board {
            background: rgba(13, 27, 18, 0.95); border: 3px solid #ffd700; border-radius: 20px;
            padding: 22px 16px; width: 90%; text-align: center; color: #ffffff; margin-bottom: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.8);
        }
        #version-tag { position: absolute; top: 62px; left: 14px; color: #ffd700; font-size: 10px; z-index: 100000; font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="version-tag">v43 ASSET-EDITION</div>

    <!-- スタート画面 -->
    <div id="start-screen">
        <div class="wanted-badge">指名手配 / 森林警察警戒中</div>
        <div class="title-logo">🌰 黄金ドングリ回収作戦 🌰</div>
        <div class="title-sub">どんぐりを大量無許可占有して警察の包囲網を突破せよ！</div>
        <button id="startBtn" class="massive-btn" onclick="startGameForce()">ゲームスタート！</button>
    </div>

    <!-- トップバー -->
    <div id="top-bar">
        <div>🐿️ 逃走経路：森の小道</div>
        <button id="bgmToggleBtn" class="bgm-btn active" onclick="toggleBGM()">🎵 BGM: ON</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- スコア表示 -->
    <div id="mid-score-board">
        <div>回収数: <span id="score" style="color:#ffd700; font-size:20px;">0</span></div>
        <div>自己ベスト: <span id="high-score" style="color:#ffffff; font-size:18px;">0</span></div>
    </div>

    <!-- 操作ボタン -->
    <div id="controls">
        <button id="leftBtn" class="ctrl-btn" onclick="moveLane(-1)">◀ 左避</button>
        <button id="jumpBtn" class="ctrl-btn" onclick="jumpAction()">▲ ジャンプ</button>
        <button id="rightBtn" class="ctrl-btn" onclick="moveLane(1)">右避 ▶</button>
    </div>

    <!-- 結果画面（表彰式 / 罪状発表） -->
    <div id="result-screen">
        <div class="result-board">
            <div style="font-size: 21px; color: #ffd700; font-weight: bold; margin-bottom: 8px; text-shadow: 1px 1px 2px #000;">🏆 栄光の表彰式 🏆</div>
            <p style="font-size:14px; color:#e5e7eb;">押収された黄金ドングリ</p>
            <p style="font-size:32px; color:#ffd700; font-weight:bold; margin: 4px 0;"><span id="res-score">0</span> 個</p>
            <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin: 10px 0;">
                <span style="font-size:14px; font-weight:bold;">評価ランク:</span>
                <span id="res-rank" style="font-size: 42px; color: #ef4444; font-weight: 900; text-shadow: 2px 2px 0 #000;">S</span>
            </div>
            <div style="font-size: 11px; color: #fca5a5; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); padding: 8px; border-radius: 8px; font-weight:bold; margin-top:8px;">
                🚨 罪状：どんぐり大量無許可占有罪 🚨
            </div>
        </div>
        <button id="restartBtn" class="massive-btn" onclick="startGameForce()">もう一度逃走する！</button>
    </div>
</div>

<script>
    var D = document;
    var canvas = D.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    // --- 画像アセットの読み込み ---
    var imgPlayer = new Image(); imgPlayer.src = 'image.png';
    var imgAcorn = new Image(); imgAcorn.src = '1788703217973.png';
    var imgPolice = new Image(); imgPolice.src = '1788703264451.png';
    var imgObstacle = new Image(); imgObstacle.src = '1788702691552.png';

    var isPlaying = false;
    var loopRunning = false;
    var score = 0;
    var highScore = 0;
    try {
        highScore = localStorage.getItem('acorn_highscore_v43') || 0;
    } catch(e) {}
    D.getElementById('high-score').innerText = highScore;

    var lanes = [100, 200, 300];
    var currentLane = 1;
    var playerX = 200;
    var playerY = 410;
    var targetX = 200;
    var isJumping = false;
    var jumpY = 0;
    var jumpV = 0;
    var objects = [];
    var speed = 7.5;
    var bgY = 0;
    var isBgmOn = true;
    var speedUpNotifyTimer = 0;

    var audioCtx = null;
    var bgmTimer = null;

    function safeInitAudio() {
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
    }

    function playHitSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            var time = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(10, time + 0.4);
            gain.gain.setValueAtTime(0.25, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.4);
        } catch(e) {}
    }

    function playAcornSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sine';
            var time = audioCtx.currentTime;
            osc.frequency.setValueAtTime(880, time);
            osc.frequency.setValueAtTime(1200, time + 0.05);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.2);
        } catch(e) {}
    }

    function playResultFanfare() {
        if (!isBgmOn || !audioCtx) return;
        if (bgmTimer) clearInterval(bgmTimer);
        try {
            var time = audioCtx.currentTime;
            var melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            var duration = [0.2, 0.2, 0.2, 0.4, 0.2, 0.8];
            var offset = 0;
            for (var i = 0; i < melody.length; i++) {
                var freq = melody[i];
                var dur = duration[i];
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, time + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, time + offset + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time + offset); osc.stop(time + offset + dur);
                offset += dur;
            }
        } catch(e) {}
    }

    function initBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        var notes = [329.63, 392.00, 440.00, 523.25, 587.33, 523.25, 440.00, 392.00, 440.00, 523.25, 659.25, 587.33];
        var step = 0;
        bgmTimer = setInterval(function() {
            if (!isPlaying || !isBgmOn || !audioCtx) return;
            try {
                var time = audioCtx.currentTime;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = notes[step % notes.length];
                gain.gain.setValueAtTime(0.03, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 0.12);
                step++;
            } catch(e) {}
        }, 135);
    }

    function toggleBGM() {
        isBgmOn = !isBgmOn;
        safeInitAudio();
        var btn = D.getElementById('bgmToggleBtn');
        btn.innerText = isBgmOn ? "🎵 BGM: ON" : "🔇 BGM: OFF";
        btn.className = isBgmOn ? "bgm-btn active" : "bgm-btn";
    }

    function startGameForce() {
        safeInitAudio();
        isPlaying = true;

        D.getElementById('start-screen').style.display = 'none';
        D.getElementById('result-screen').style.display = 'none';
        D.getElementById('controls').style.display = 'flex';
        D.getElementById('mid-score-board').style.display = 'flex';

        score = 0;
        speed = 7.5;
        speedUpNotifyTimer = 0;
        currentLane = 1;
        targetX = lanes[currentLane];
        playerX = targetX;
        objects = [];
        D.getElementById('score').innerText = score;

        initBGM();

        if (!loopRunning) {
            loopRunning = true;
            requestAnimationFrame(gameLoop);
        }
    }

    function moveLane(dir) {
        if (!isPlaying) return;
        currentLane += dir;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        targetX = lanes[currentLane];
    }

    function jumpAction() {
        if (isPlaying && !isJumping) {
            isJumping = true;
            jumpV = -16;
        }
    }

    function endGame() {
        isPlaying = false;
        loopRunning = false;
        if (bgmTimer) clearInterval(bgmTimer);
        playHitSE();

        if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('acorn_highscore_v43', highScore); } catch(e) {}
            D.getElementById('high-score').innerText = highScore;
        }

        D.getElementById('res-score').innerText = score;
        var rank = score >= 300 ? 'S' : score >= 200 ? 'A' : score >= 100 ? 'B' : 'C';
        D.getElementById('res-rank').innerText = rank;

        D.getElementById('controls').style.display = 'none';
        D.getElementById('mid-score-board').style.display = 'none';
        D.getElementById('result-screen').style.display = 'flex';

        setTimeout(function() { playResultFanfare(); }, 150);
    }

    window.addEventListener('keydown', function(e) {
        if (!isPlaying) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
        else if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
            jumpAction(); e.preventDefault();
        }
    });

    var timer = 0;
    var speedCounter = 0;
    function gameLoop() {
        if (!isPlaying) return;

        playerX += (targetX - playerX) * 0.35;
        if (isJumping) {
            jumpY += jumpV;
            jumpV += 0.95;
            if (jumpY >= 0) { jumpY = 0; isJumping = false; }
        }

        bgY = (bgY + speed) % 140;

        timer++;
        if (timer > 20) {
            var lane = Math.floor(Math.random() * 3);
            var isEnemy = Math.random() < 0.48;
            var enemyType = Math.floor(Math.random() * 2);
            objects.push({ x: lanes[lane], y: -60, enemy: isEnemy, type: enemyType });
            timer = 0;
            speed += 0.008;
            speedCounter++;
            if (speedCounter % 35 === 0) speedUpNotifyTimer = 40;
        }

        // --- 背景描画（森の小道） ---
        ctx.fillStyle = '#1b4d3e'; ctx.fillRect(0, 0, 400, 700);

        // 小道
        ctx.fillStyle = '#5c4033'; ctx.fillRect(45, 0, 310, 700);
        ctx.strokeStyle = '#3d2817'; ctx.lineWidth = 4; ctx.strokeRect(45, 0, 310, 700);

        // 左右の木々
        ctx.fillStyle = '#14382c';
        for (var py = -140 + bgY; py < 700; py += 140) {
            ctx.beginPath(); ctx.arc(22, py, 35, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(378, py + 70, 35, 0, Math.PI * 2); ctx.fill();
        }

        // 中央線
        ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 4; ctx.setLineDash([20, 25]); ctx.lineDashOffset = -bgY;
        ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 700); ctx.moveTo(250, 0); ctx.lineTo(250, 700); ctx.stroke();
        ctx.setLineDash([]);

        // --- オブジェクト描画 ---
        for (var i = objects.length - 1; i >= 0; i--) {
            var o = objects[i];
            o.y += speed;

            var dx = Math.abs(playerX - o.x);
            var dy = Math.abs((playerY + jumpY) - o.y);
            
            if (dx < 36 && dy < 38) {
                if (o.enemy) {
                    if (jumpY > -20) { endGame(); return; }
                } else {
                    score += 10;
                    D.getElementById('score').innerText = score;
                    playAcornSE();
                    objects.splice(i, 1);
                    continue;
                }
            }

            if (o.enemy) {
                // 警察風障害物（画像が読み込まれていれば画像を使用、未ロード時は図形フォールバック）
                ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 18, 28, 9, 0, 0, 6.28); ctx.fill();
                
                var policeImg = (o.type === 0) ? imgPolice : imgObstacle;
                if (policeImg && policeImg.complete && policeImg.naturalWidth > 0) {
                    ctx.drawImage(policeImg, o.x - 24, o.y - 24, 48, 48);
                } else {
                    // フォールバック描画
                    ctx.fillStyle = '#b91c1c'; ctx.fillRect(o.x - 24, o.y - 12, 48, 24);
                }
            } else {
                // ドングリ（画像が読み込まれていれば画像を使用）
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 16, 14, 6, 0, 0, 6.28); ctx.fill();
                
                if (imgAcorn && imgAcorn.complete && imgAcorn.naturalWidth > 0) {
                    ctx.drawImage(imgAcorn, o.x - 18, o.y - 18, 36, 36);
                } else {
                    // フォールバック描画
                    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(o.x, o.y, 14, 0, Math.PI * 2); ctx.fill();
                }
            }
            if (o.y > 780) objects.splice(i, 1);
        }

        // --- 主人公（リスの逃走キャラ）描画 ---
        var pDrawY = playerY + jumpY;
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 45, 38, 10, 0, 0, 6.28); ctx.fill();

        if (imgPlayer && imgPlayer.complete && imgPlayer.naturalWidth > 0) {
            ctx.drawImage(imgPlayer, playerX - 28, pDrawY - 28, 56, 56);
        } else {
            // フォールバック描画（リス風）
            ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 10, 26, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fef3c7'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 2, 16, 0, Math.PI * 2); ctx.fill();
        }

        if (speedUpNotifyTimer > 0) {
            speedUpNotifyTimer--;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.95)';
            ctx.font = '900 22px sans-serif';
            ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            ctx.strokeText('⚡ 警察の包囲網加速！ ⚡', 200, 260); ctx.fillText('⚡ 警察の包囲網加速！ ⚡', 200, 260);
        }
        if (isPlaying) requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
