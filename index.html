<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            max-height: 800px;
            background: linear-gradient(180deg, #243422 0%, #384e31 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }

        #sound-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 60;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700;
            color: #fff;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* ① トップ画面 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1b2618;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 70px;
            z-index: 30;
            overflow: hidden;
        }
        
        #start-btn {
            width: 85%;
            padding: 18px;
            background: linear-gradient(180deg, #ffea00, #ff8800);
            border: 3px solid #ffffff;
            border-radius: 35px;
            color: #000;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7);
            animation: pulse 1.5s infinite;
            touch-action: manipulation;
            z-index: 35;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

        /* スコアバー */
        #top-bar {
            position: absolute;
            top: 12px; left: 12px; right: 64px; height: 42px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            z-index: 20;
        }
        .score-text { color: #ffd700; font-size: 16px; }

        canvas { width: 100%; height: 100%; display: block; z-index: 10; }

        /* 操作ボタン */
        #controls {
            position: absolute;
            bottom: 20px; left: 12px; right: 12px;
            display: none;
            justify-content: space-between;
            gap: 10px;
            z-index: 20;
        }
        .btn {
            flex: 1; padding: 16px 0;
            background: linear-gradient(180deg, #9a6332, #5c3a17);
            border: 2px solid #ffd700;
            border-radius: 25px;
            color: #ffffff; font-weight: bold; font-size: 16px;
            text-align: center; cursor: pointer; touch-action: manipulation;
        }

        /* ③ 結果発表画面 */
        #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 15%;
            align-items: center;
            z-index: 30;
            overflow: hidden;
        }
        .result-board {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            border: 3px solid #ffd700;
            border-radius: 18px;
            padding: 22px 16px;
            width: 90%;
            text-align: center;
            color: #ffffff;
            z-index: 35;
        }
        .result-title { font-size: 24px; color: #ffd700; margin-bottom: 12px; font-weight: bold; }
        .rank-badge { font-size: 48px; color: #ff4444; font-weight: bold; margin: 4px 0; }
        
        #restart-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%; padding: 16px;
            background: linear-gradient(180deg, #ffea00, #ff8800);
            border: 3px solid #ffffff; border-radius: 30px;
            color: #000; font-size: 20px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 40;
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="sound-btn" onclick="toggleSound()">🔊</button>

    <!-- ① スタート画面 -->
    <div id="start-screen">
        <canvas id="start-particles" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:32;"></canvas>
        <button id="start-btn" onclick="startGame()">スタート！</button>
    </div>

    <!-- UIバー -->
    <div id="top-bar">
        <div>黄金ドングリ: <span id="score" class="score-text">0</span> 個</div>
        <div>最高: <span id="high-score">0</span></div>
    </div>

    <!-- ゲーム描画 -->
    <canvas id="gameCanvas"></canvas>

    <!-- ② プレイ中のボタン -->
    <div id="controls">
        <div class="btn" id="btn-left">◀ 左</div>
        <div class="btn" id="btn-jump">▲ ジャンプ</div>
        <div class="btn" id="btn-right">右 ▶</div>
    </div>

    <!-- ③ 結果画面 -->
    <div id="result-screen">
        <canvas id="result-particles" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:32;"></canvas>
        <div class="result-board">
            <div class="result-title">【 結 果 発 表 】</div>
            <p style="font-size:14px; color:#ddd;">押収された黄金ドングリ</p>
            <div style="font-size: 26px; color: #ffd700; margin: 6px 0; font-weight:bold;"><span id="res-score">0</span> 個</div>
            <p style="font-size:14px; color:#ddd; margin-top:8px;">評価ランク</p>
            <div id="res-rank" class="rank-badge">S</div>
            <p style="font-size: 11px; margin-top: 8px; color: #aaa;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <button id="restart-btn" onclick="resetGame()">もう一度走る！</button>
    </div>
</div>

<script>
    // ==========================================
    // ✨ 粉吹雪（パーティクル）演出
    // ==========================================
    class ParticleSystem {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId);
            this.ctx = this.canvas.getContext('2d');
            this.particles = [];
            this.init();
        }
        init() {
            this.canvas.width = 400;
            this.canvas.height = 700;
            for(let i=0; i<40; i++) {
                this.particles.push({
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    radius: Math.random() * 3 + 1,
                    speedY: Math.random() * 1.5 + 0.5,
                    speedX: (Math.random() - 0.5) * 1,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }
        updateAndDraw() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y > this.canvas.height) { p.y = 0; p.x = Math.random() * this.canvas.width; }
                
                this.ctx.fillStyle = `rgba(255, 230, 150, ${p.alpha})`;
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                this.ctx.fill();
            });
        }
    }
    const startParticles = new ParticleSystem('start-particles');
    const resultParticles = new ParticleSystem('result-particles');

    function runParticleLoops() {
        startParticles.updateAndDraw();
        resultParticles.updateAndDraw();
        requestAnimationFrame(runParticleLoops);
    }
    runParticleLoops();


    // ==========================================
    // 🖼️ 画像自動設定＆透過システム
    // ==========================================
    const IMAGE_CANDIDATES = [
        '1788702691552.png',
        '1788793264451.png',
        '1788793217973.png',
        'image.png',
        'title.png', 'player.png', 'result.png', 'acorn.png'
    ];

    const loadedImages = {};
    let playerImgObj = null;
    let acornImgObj = null;

    function makeTransparent(imgObj, isPlayer) {
        try {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = imgObj.naturalWidth;
            tCanvas.height = imgObj.naturalHeight;
            const tCtx = tCanvas.getContext('2d');
            tCtx.drawImage(imgObj, 0, 0);
            const imgData = tCtx.getImageData(0, 0, tCanvas.width, tCanvas.height);
            const data = imgData.data;
            
            for(let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const max = Math.max(r, g, b), min = Math.min(r, g, b), diff = max - min;

                if (isPlayer) {
                    const isMonochrome = Math.abs(r - g) < 20 && Math.abs(g - b) < 20;
                    if (isMonochrome && r > 150) { data[i+3] = 0; }
                } else {
                    if ((r > 200 && g > 200 && b > 200) || (r < 50 && g < 50 && b < 50) || (diff < 20 && max > 150)) {
                        data[i+3] = 0;
                    }
                }
            }
            tCtx.putImageData(imgData, 0, 0);
            return tCanvas;
        } catch(e) {
            return imgObj;
        }
    }

    function initImages() {
        let loadedCount = 0;
        IMAGE_CANDIDATES.forEach(filename => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => { loadedImages[filename] = img; checkDone(); };
            img.onerror = () => { checkDone(); };
            img.src = filename;
        });

        function checkDone() {
            loadedCount++;
            if (loadedCount === IMAGE_CANDIDATES.length) applyLoadedImages();
        }
    }

    function applyLoadedImages() {
        const startImg = loadedImages['1788702691552.png'] || loadedImages['title.png'];
        if (startImg) document.getElementById('start-screen').style.backgroundImage = `url('${startImg.src}')`;
        
        const resultImg = loadedImages['1788793217973.png'] || loadedImages['result.png'];
        if (resultImg) document.getElementById('result-screen').style.backgroundImage = `url('${resultImg.src}')`;

        const rawPlayer = loadedImages['1788793264451.png'] || loadedImages['player.png'];
        if (rawPlayer && rawPlayer.complete && rawPlayer.naturalWidth !== 0) {
            playerImgObj = makeTransparent(rawPlayer, true);
        }

        const rawAcorn = loadedImages['image.png'] || loadedImages['acorn.png'];
        if (rawAcorn && rawAcorn.complete && rawAcorn.naturalWidth !== 0) {
            acornImgObj = makeTransparent(rawAcorn, false);
        }
    }
    initImages();

    // ==========================================
    // 🎵 緊迫感のあるBGM ＆ サウンドシステム
    // ==========================================
    class SoundManager {
        constructor() { 
            this.ctx = null; 
            this.muted = false; 
            this.bgmTimer = null;
            this.step = 0;
        }
        init() {
            try {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            } catch(e) { this.muted = true; }
        }
        playTone(freq, type, duration, vol=0.1) {
            try {
                this.init();
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            } catch(e) {}
        }
        playJump() { this.playTone(400, 'sine', 0.15, 0.1); }
        playCoin() { this.playTone(987, 'sine', 0.08, 0.15); setTimeout(() => this.playTone(1318, 'sine', 0.15, 0.15), 60); }
        playGameOver() { this.playTone(220, 'sawtooth', 0.5, 0.2); }

        startBGM() {
            if (this.bgmTimer) return;
            // 緊迫感のあるチェイス風BGM（マイナーコードのアルペジオ）
            const notes = [220, 261.63, 329.63, 392.00, 329.63, 261.63]; 
            this.step = 0;
            this.bgmTimer = setInterval(() => {
                if (this.muted) return;
                const freq = notes[this.step % notes.length];
                this.playTone(freq, 'sawtooth', 0.12, 0.04);
                if (this.step % 2 === 0) {
                    this.playTone(110, 'triangle', 0.2, 0.06); // 低音ベース
                }
                this.step++;
            }, 140);
        }
        stopBGM() {
            if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
        }
    }
    const sound = new SoundManager();
    function toggleSound() {
        sound.muted = !sound.muted;
        document.getElementById('sound-btn').textContent = sound.muted ? '🔇' : '🔊';
    }

    // ==========================================
    // 🎮 ゲーム本体の初期化・ループ
    // ==========================================
    function setGameState(state) {
        const s = document.getElementById('start-screen');
        const r = document.getElementById('result-screen');
        const c = document.getElementById('controls');
        if (state === 'START') { s.style.display = 'flex'; r.style.display = 'none'; c.style.display = 'none'; sound.stopBGM(); }
        else if (state === 'PLAYING') { s.style.display = 'none'; r.style.display = 'none'; c.style.display = 'flex'; sound.startBGM(); }
        else if (state === 'RESULT') { s.style.display = 'none'; r.style.display = 'flex'; c.style.display = 'none'; sound.stopBGM(); }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    let score = 0;
    let highScore = 0;
    try { highScore = localStorage.getItem('acorn_highscore') || 0; } catch(e) {}
    document.getElementById('high-score').textContent = highScore;

    let isGameOver = false; let isPlaying = false;
    const lanes = [100, 200, 300];
    let currentLane = 1; let targetX = lanes[currentLane];
    let playerX = targetX; let playerY = 520;
    let isJumping = false; let jumpOffsetY = 0; let jumpVelocity = 0;
    const gravity = 0.85;
    let objects = []; let speed = 7; let spawnTimer = 0; let bgOffset = 0;
    let sirenFlash = 0; // パトランプ点滅用

    document.getElementById('btn-left').addEventListener('click', () => moveLane(-1));
    document.getElementById('btn-right').addEventListener('click', () => moveLane(1));
    document.getElementById('btn-jump').addEventListener('click', jump);

    function moveLane(dir) {
        if (!isPlaying || isGameOver) return;
        currentLane = Math.max(0, Math.min(2, currentLane + dir));
        targetX = lanes[currentLane];
    }
    function jump() {
        if (isPlaying && !isJumping && !isGameOver) {
            isJumping = true; jumpVelocity = -15; sound.playJump();
        }
    }

    function startGame() {
        try { sound.init(); } catch(e) {}
        isPlaying = true; isGameOver = false;
        setGameState('PLAYING');
        gameLoop();
    }

    function spawnObject() {
        const lane = Math.floor(Math.random() * 3);
        const isObstacle = Math.random() < 0.4;
        const types = ['desk', 'chair', 'shelf'];
        const obsType = types[Math.floor(Math.random() * types.length)];
        objects.push({ x: lanes[lane], y: -50, type: isObstacle ? obsType : 'acorn' });
    }

    function update() {
        if (!isPlaying || isGameOver) return;
        playerX += (targetX - playerX) * 0.25;

        if (isJumping) {
            jumpOffsetY += jumpVelocity; jumpVelocity += gravity;
            if (jumpOffsetY >= 0) { jumpOffsetY = 0; isJumping = false; }
        }
        bgOffset = (bgOffset + speed) % 50;
        sirenFlash = (sirenFlash + 0.15) % (Math.PI * 2); // パトランプ点滅用サイクル

        spawnTimer++;
        if (spawnTimer > 28) { spawnObject(); spawnTimer = 0; speed += 0.003; }

        for (let i = objects.length - 1; i >= 0; i--) {
            let obj = objects[i]; obj.y += speed;
            let dx = Math.abs(playerX - obj.x);
            let dy = Math.abs((playerY + jumpOffsetY) - obj.y);

            if (dx < 35 && dy < 45) {
                if (obj.type === 'acorn') {
                    score += 10; document.getElementById('score').textContent = score;
                    sound.playCoin(); objects.splice(i, 1); continue;
                } else {
                    // オフィス家具にぶつかった場合
                    if (jumpOffsetY > -25) { endGame(); return; }
                }
            }
            if (obj.y > canvas.height + 50) objects.splice(i, 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ① 明るめにした森＆道路の背景描画
        ctx.fillStyle = '#3a4f32'; ctx.fillRect(0, 0, canvas.width, canvas.height); // 明るい森林地帯
        ctx.fillStyle = '#6b533d'; ctx.fillRect(40, 0, 320, canvas.height); // 明るい茶色の道路
        
        // 両サイドの森の木陰模様
        ctx.fillStyle = '#263520';
        ctx.fillRect(0, 0, 40, canvas.height);
        ctx.fillRect(360, 0, 40, canvas.height);

        // 道路の中央線（白線）
        ctx.strokeStyle = '#d2b48c'; ctx.setLineDash([25, 25]);
        ctx.lineDashOffset = -bgOffset; ctx.lineWidth = 4; ctx.beginPath();
        ctx.moveTo(146, 0); ctx.lineTo(146, canvas.height);
        ctx.moveTo(254, 0); ctx.lineTo(254, canvas.height); ctx.stroke(); ctx.setLineDash([]);

        // ② 警察の追跡を表現する「パトランプの光（赤と青のサイレン点滅演出）」
        const redAlpha = (Math.sin(sirenFlash) + 1) * 0.15;
        const blueAlpha = (Math.cos(sirenFlash) + 1) * 0.15;
        ctx.fillStyle = `rgba(255, 0, 0, ${redAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
        ctx.fillStyle = `rgba(0, 100, 255, ${blueAlpha})`;
        ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

        // ③ オブジェクト（ドングリ ＆ オフィス家具）の描画
        objects.forEach(obj => {
            if (obj.type === 'acorn') {
                if (acornImgObj && acornImgObj.width) {
                    const aspect = acornImgObj.width / acornImgObj.height;
                    let drawW
