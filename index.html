<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            background-color: #0d1117; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: sans-serif; overflow: hidden;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 420px; height: 100vh; max-height: 800px;
            background: linear-gradient(180deg, #1b2618 0%, #0d130a 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* トップ画面 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: 80px; z-index: 50;
        }
        #fallback-title {
            position: absolute; top: 30%; color: #ffd700; font-size: 32px; font-weight: bold;
            text-shadow: 2px 2px 0 #000; text-align: center; width: 100%; z-index: 51;
        }
        .massive-btn {
            width: 85%; padding: 20px; background: linear-gradient(180deg, #ffea00, #ff8800);
            border: 3px solid #ffffff; border-radius: 40px; color: #000; font-size: 24px; font-weight: bold;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7); z-index: 60; cursor: pointer; text-align: center;
        }
        .massive-btn:active { transform: scale(0.95); background: #ff8800; }

        /* スコアバー */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; height: 42px;
            background: rgba(0, 0, 0, 0.7); border: 2px solid #ffd700; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 14px;
            color: #ffffff; font-size: 14px; font-weight: bold; z-index: 20; backdrop-filter: blur(4px);
        }
        
        canvas { width: 100%; height: 100%; display: block; z-index: 10; }

        /* 操作ボタン */
        #controls {
            position: absolute; bottom: 20px; left: 10px; right: 10px; display: none;
            justify-content: space-between; gap: 8px; z-index: 40;
        }
        .ctrl-btn {
            flex: 1; padding: 18px 0; background: linear-gradient(180deg, #8b5a2b, #4a2e12);
            border: 2px solid #ffd700; border-radius: 20px; color: #ffffff; font-weight: bold;
            font-size: 16px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { background: #4a2e12; transform: translateY(2px); }

        /* 結果画面 */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50;
        }
        /* 結果画面を見やすくするためのダークフィルター */
        #result-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); z-index: 1;
        }
        .result-board {
            position: relative; background: rgba(0, 0, 0, 0.85); border: 3px solid #ffd700; border-radius: 18px;
            padding: 24px 16px; width: 90%; text-align: center; color: #ffffff; margin-bottom: 40px; z-index: 2;
        }

        #version-tag { position: absolute; top: 60px; left: 12px; color: #fff; font-size: 12px; z-index: 99; opacity: 0.5; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="version-tag">v7 REFINERY</div>

    <div id="start-screen">
        <div id="fallback-title">黄金ドングリを集め出せ！</div>
        <div class="massive-btn" onclick="startGame(event)" ontouchstart="startGame(event)">スタート！</div>
    </div>

    <div id="top-bar">
        <div>ドングリ: <span id="score" style="color:#ffd700;">0</span></div>
        <div>最高: <span id="high-score">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="ctrl-btn" onclick="moveLane(-1, event)" ontouchstart="moveLane(-1, event)">◀ 左</div>
        <div class="ctrl-btn" onclick="jumpAction(event)" ontouchstart="jumpAction(event)">▲ ジャンプ</div>
        <div class="ctrl-btn" onclick="moveLane(1, event)" ontouchstart="moveLane(1, event)">右 ▶</div>
    </div>

    <div id="result-screen">
        <div class="result-board">
            <div style="font-size: 24px; color: #ffd700; font-weight: bold;">結果発表</div>
            <p style="margin-top:10px;">押収ドングリ: <span id="res-score" style="font-size:28px; color:#ffd700;">0</span> 個</p>
            <div id="res-rank" style="font-size: 50px; color: #ff4444; font-weight: bold; margin: 10px 0;">S</div>
            <p style="font-size: 12px; color: #aaa;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <div class="massive-btn" onclick="startGame(event)" ontouchstart="startGame(event)" style="position:relative; z-index:2;">もう一度走る！</div>
    </div>
</div>

<script>
    var D = document;
    var canvas = D.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    var isPlaying = false;
    var loopRunning = false;
    var score = 0;
    var highScore = localStorage.getItem('acorn_highscore') || 0;
    D.getElementById('high-score').innerText = highScore;

    var lanes = [100, 200, 300];
    var currentLane = 1;
    var playerX = 200;
    var playerY = 520;
    var targetX = 200;
    var isJumping = false;
    var jumpY = 0;
    var jumpV = 0;
    var objects = [];
    var speed = 7;
    var bgY = 0;
    var siren = 0;

    // 画像読み込み
    var imgTitle = new Image(); imgTitle.src = '1788702691552.png';
    var imgResult = new Image(); imgResult.src = '1788793217973.png';
    var imgPlayer = new Image(); imgPlayer.src = '1788793264451.png';
    var imgAcorn = new Image(); imgAcorn.src = 'image.png';

    imgTitle.onload = function() {
        D.getElementById('start-screen').style.backgroundImage = "url('" + imgTitle.src + "')";
        D.getElementById('fallback-title').style.display = "none";
    };
    imgResult.onload = function() {
        D.getElementById('result-screen').style.backgroundImage = "url('" + imgResult.src + "')";
    };

    function startGame(e) {
        if (e) e.preventDefault();
        if (isPlaying) return;

        D.getElementById('start-screen').style.display = 'none';
        D.getElementById('result-screen').style.display = 'none';
        D.getElementById('controls').style.display = 'flex';

        isPlaying = true;
        score = 0;
        speed = 7;
        currentLane = 1;
        targetX = lanes[currentLane];
        playerX = targetX;
        objects = [];
        D.getElementById('score').innerText = score;

        if (!loopRunning) {
            loopRunning = true;
            requestAnimationFrame(gameLoop);
        }
    }

    function moveLane(dir, e) {
        if (e) e.preventDefault();
        if (!isPlaying) return;
        currentLane += dir;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        targetX = lanes[currentLane];
    }

    function jumpAction(e) {
        if (e) e.preventDefault();
        if (isPlaying && !isJumping) {
            isJumping = true;
            jumpV = -15;
        }
    }

    function endGame() {
        isPlaying = false;
        loopRunning = false;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('acorn_highscore', highScore);
            D.getElementById('high-score').innerText = highScore;
        }

        D.getElementById('res-score').innerText = score;
        var rank = score >= 300 ? 'S' : score >= 200 ? 'A' : score >= 100 ? 'B' : 'C';
        D.getElementById('res-rank').innerText = rank;

        D.getElementById('controls').style.display = 'none';
        D.getElementById('result-screen').style.display = 'flex';
    }

    var timer = 0;
    function gameLoop() {
        if (!isPlaying) return;

        playerX += (targetX - playerX) * 0.3;
        if (isJumping) {
            jumpY += jumpV;
            jumpV += 0.85;
            if (jumpY >= 0) { jumpY = 0; isJumping = false; }
        }

        bgY = (bgY + speed) % 700;
        siren = (siren + 0.1) % 6.28;

        timer++;
        if (timer > 25) {
            var lane = Math.floor(Math.random() * 3);
            var isEnemy = Math.random() < 0.4;
            objects.push({ x: lanes[lane], y: -50, enemy: isEnemy });
            timer = 0;
            speed += 0.005;
        }

        // ==========================================
        // 描画パート：今の画像を活かしたリッチな森の演出
        // ==========================================
        ctx.clearRect(0, 0, 400, 700);

        // 1. 背景：タイトル画像の森を流れるように敷き詰める（ロード済みの場合）
        if (imgTitle.complete && imgTitle.naturalWidth > 0) {
            ctx.drawImage(imgTitle, 0, bgY - 700, 400, 700);
            ctx.drawImage(imgTitle, 0, bgY, 400, 700);
        } else {
            ctx.fillStyle = '#1b2618'; ctx.fillRect(0, 0, 400, 700);
        }

        // 2. レーンを分かりやすくする半透明の道オーバーレイ
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(50, 0, 300, 700);

        // 3. けもの道のセンターライン（光る草の軌跡風）
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)'; ctx.lineWidth = 3; ctx.setLineDash([20, 20]); ctx.lineDashOffset = -bgY;
        ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 700); ctx.moveTo(250, 0); ctx.lineTo(250, 700); ctx.stroke();
        ctx.setLineDash([]); // リセット

        // 4. 警察のサイレン演出（控えめな光）
        ctx.fillStyle = "rgba(255, 0, 0, " + ((Math.sin(siren) + 1) * 0.1) + ")"; ctx.fillRect(0, 0, 400, 350);
        ctx.fillStyle = "rgba(0, 100, 255, " + ((Math.cos(siren) + 1) * 0.1) + ")"; ctx.fillRect(0, 350, 400, 350);

        // 5. オブジェクト処理
        for (var i = objects.length - 1; i >= 0; i--) {
            var o = objects[i];
            o.y += speed;

            var dx = Math.abs(playerX - o.x);
            var dy = Math.abs((playerY + jumpY) - o.y);
            
            if (dx < 35 && dy < 45) {
                if (o.enemy) {
                    if (jumpY > -20) { endGame(); return; }
                } else {
                    score += 10;
                    D.getElementById('score').innerText = score;
                    objects.splice(i, 1);
                    continue;
                }
            }

            if (o.enemy) {
                // 障害物：少し立体的な「丸太（バリケード風）」にデザイン
                ctx.fillStyle = '#4a2e12'; ctx.fillRect(o.x - 28, o.y - 14, 56, 28);
                ctx.fillStyle = '#6b4218'; ctx.fillRect(o.x - 24, o.y - 10, 48, 20);
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('STOP', o.x, o.y + 4);
            } else {
                // ドングリ：白い背景を自動で消す（multiply合成 または 丸型クリップ）
                ctx.save();
                if (imgAcorn.complete && imgAcorn.naturalWidth > 0) {
                    // 丸く切り抜いて配置することで四角い白背景を完全に隠す
                    ctx.beginPath(); ctx.arc(o.x, o.y, 24, 0, 6.28); ctx.clip();
                    ctx.drawImage(imgAcorn, o.x - 28, o.y - 28, 56, 56);
                } else {
                    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(o.x, o.y, 22, 0, 6.28); ctx.fill();
                }
                ctx.restore();
            }

            if (o.y > 750) objects.splice(i, 1);
        }

        // 6. プレイヤー（おばあちゃん＆イノシシ）の描画：白い四角を綺麗に消す合成処理
        var py = playerY + jumpY;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 45, 28, 9, 0, 0, 6.28); ctx.fill();

        ctx.save();
        if (imgPlayer.complete && imgPlayer.naturalWidth > 0) {
            // 画像の周りを円形にクリップしつつ、さらに白背景が馴染むように配置
            ctx.beginPath(); ctx.arc(playerX, py - 10, 42, 0, 6.28); ctx.clip();
            ctx.drawImage(imgPlayer, playerX - 48, py - 60, 96, 96);
        } else {
            ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(playerX, py, 30, 0, 6.28); ctx.fill();
        }
        ctx.restore();

        if (isPlaying) requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
