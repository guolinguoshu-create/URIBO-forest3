<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黄金ドングリ回収作戦</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body {
            background-color: #0b130b; display: flex; justify-content: center; align-items: center;
            height: 100%; height: 100dvh; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden;
            overscroll-behavior-y: none;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 420px; 
            height: 100%; height: 100dvh; max-height: 800px;
            background: #1b4d3e; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* スタート画面 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #113322 0%, #1b4d3e 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; z-index: 99999; text-align: center;
        }
        .title-logo {
            font-size: 30px; font-weight: 900; color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }
        .title-sub {
            font-size: 14px; color: #aaddcc; margin-bottom: 35px; font-weight: bold;
        }
        .massive-btn {
            width: 85%; padding: 18px; background: linear-gradient(180deg, #ffe600, #ff8800);
            border: 3px solid #ffffff; border-radius: 40px; color: #1a0000; font-size: 22px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 100000; cursor: pointer; text-align: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6); outline: none; -webkit-tap-highlight-color: transparent;
            font-family: inherit; touch-action: manipulation;
        }
        .massive-btn:active { transform: scale(0.96); background: linear-gradient(180deg, #ddcc00, #dd6600); }

        /* トップバー */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; height: 40px;
            background: rgba(20, 35, 20, 0.85); border: 2px solid #ffd700; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
            color: #ffffff; font-size: 13px; font-weight: bold; z-index: 20;
        }
        .bgm-btn {
            background: linear-gradient(180deg, #444, #222); border: 1.5px solid #ffd700; color: #ffd700;
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            outline: none; font-family: inherit; touch-action: manipulation;
        }
        .bgm-btn.active { background: linear-gradient(180deg, #ff8800, #cc5500); color: #fff; }

        canvas { width: 100%; height: 100%; display: block; z-index: 10; touch-action: none; }

        /* スコアエリア */
        #mid-score-board {
            position: absolute; bottom: 120px; left: 16px; right: 16px;
            background: rgba(15, 25, 15, 0.9); border: 2px solid #ffd700; border-radius: 14px;
            display: none; justify-content: space-around; align-items: center; padding: 10px 0;
            color: #ffffff; font-size: 15px; font-weight: bold; z-index: 40;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 操作ボタン */
        #controls {
            position: absolute; bottom: 40px; left: 16px; right: 16px; display: none;
            justify-content: space-between; gap: 12px; z-index: 40;
        }
        .ctrl-btn {
            flex: 1; padding: 16px 0; background: linear-gradient(180deg, #a06836, #5c3818);
            border: 2px solid #ffd700; border-radius: 16px; color: #ffffff; font-weight: bold;
            font-size: 18px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; font-family: inherit;
            touch-action: manipulation;
        }
        .ctrl-btn:active { background: #5c3818; transform: translateY(2px); }

        /* 結果発表画面 */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #113322 0%, #1b4d3e 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; z-index: 99999; text-align: center;
        }
        .result-board {
            background: rgba(20, 30, 20, 0.92); border: 3px solid #ffd700; border-radius: 20px;
            padding: 20px; width: 90%; text-align: center; color: #ffffff; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #version-tag { position: absolute; top: 60px; left: 14px; color: #ffd700; font-size: 11px; z-index: 100000; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="version-tag">v41 STANDALONE</div>

    <div id="start-screen">
        <div class="title-logo">🌰 黄金ドングリ回収作戦 🌰</div>
        <div class="title-sub">どんぐりを大量無許可占有して逃走せよ！</div>
        <button id="startBtn" class="massive-btn" onclick="startGameForce()">ゲームスタート！</button>
    </div>

    <div id="top-bar">
        <div>黄金ドングリ回収作戦</div>
        <button id="bgmToggleBtn" class="bgm-btn active" onclick="toggleBGM()">🎵 BGM: ON</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mid-score-board">
        <div>ドングリ: <span id="score" style="color:#ffd700; font-size:20px;">0</span></div>
        <div>最高記録: <span id="high-score" style="color:#ffffff; font-size:18px;">0</span></div>
    </div>

    <div id="controls">
        <button id="leftBtn" class="ctrl-btn" onclick="moveLane(-1)">◀ 左</button>
        <button id="jumpBtn" class="ctrl-btn" onclick="jumpAction()">▲ ジャンプ</button>
        <button id="rightBtn" class="ctrl-btn" onclick="moveLane(1)">右 ▶</button>
    </div>

    <div id="result-screen">
        <div class="result-board">
            <div style="font-size: 22px; color: #ffd700; font-weight: bold; margin-bottom: 10px;">🏆 栄光の表彰式 🏆</div>
            <p style="font-size:15px;">押収ドングリ: <span id="res-score" style="font-size:32px; color:#ffd700; font-weight:bold;">0</span> 個</p>
            <div id="res-rank" style="font-size: 55px; color: #ff3333; font-weight: bold; margin: 5px 0;">S</div>
            <p style="font-size: 12px; color: #ffdddd; background: rgba(255,0,0,0.3); padding: 6px; border-radius: 6px; font-weight:bold; margin-top:10px;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <button id="restartBtn" class="massive-btn" onclick="startGameForce()">もう一度走る！</button>
    </div>
</div>

<script>
    var D = document;
    var canvas = D.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    var isPlaying = false;
    var loopRunning = false;
    var score = 0;
    var highScore = 0;
    try {
        highScore = localStorage.getItem('acorn_highscore_v41') || 0;
    } catch(e) {}
    D.getElementById('high-score').innerText = highScore;

    var lanes = [100, 200, 300];
    var currentLane = 1;
    var playerX = 200;
    var playerY = 410;
    var targetX = 200;
    var isJumping = false;
    var jumpY = 0;
    var jumpV = 0;
    var objects = [];
    var speed = 7.5;
    var bgY = 0;
    var isBgmOn = true;
    var speedUpNotifyTimer = 0;

    var audioCtx = null;
    var bgmTimer = null;

    function safeInitAudio() {
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
    }

    function playHitSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            var time = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(10, time + 0.4);
            gain.gain.setValueAtTime(0.25, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.4);
        } catch(e) {}
    }

    function playAcornSE() {
        if (!isBgmOn || !audioCtx) return;
        try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'sine';
            var time = audioCtx.currentTime;
            osc.frequency.setValueAtTime(880, time);
            osc.frequency.setValueAtTime(1200, time + 0.05);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.2);
        } catch(e) {}
    }

    function playResultFanfare() {
        if (!isBgmOn || !audioCtx) return;
        if (bgmTimer) clearInterval(bgmTimer);
        try {
            var time = audioCtx.currentTime;
            var melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            var duration = [0.2, 0.2, 0.2, 0.4, 0.2, 0.8];
            var offset = 0;
            for (var i = 0; i < melody.length; i++) {
                var freq = melody[i];
                var dur = duration[i];
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, time + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, time + offset + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time + offset); osc.stop(time + offset + dur);
                offset += dur;
            }
        } catch(e) {}
    }

    function initBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        var notes = [329.63, 392.00, 440.00, 523.25, 587.33, 523.25, 440.00, 392.00, 440.00, 523.25, 659.25, 587.33];
        var step = 0;
        bgmTimer = setInterval(function() {
            if (!isPlaying || !isBgmOn || !audioCtx) return;
            try {
                var time = audioCtx.currentTime;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = notes[step % notes.length];
                gain.gain.setValueAtTime(0.03, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 0.12);
                step++;
            } catch(e) {}
        }, 135);
    }

    function toggleBGM() {
        isBgmOn = !isBgmOn;
        safeInitAudio();
        var btn = D.getElementById('bgmToggleBtn');
        btn.innerText = isBgmOn ? "🎵 BGM: ON" : "🔇 BGM: OFF";
        btn.className = isBgmOn ? "bgm-btn active" : "bgm-btn";
    }

    function startGameForce() {
        safeInitAudio();
        isPlaying = true;

        D.getElementById('start-screen').style.display = 'none';
        D.getElementById('result-screen').style.display = 'none';
        D.getElementById('controls').style.display = 'flex';
        D.getElementById('mid-score-board').style.display = 'flex';

        score = 0;
        speed = 7.5;
        speedUpNotifyTimer = 0;
        currentLane = 1;
        targetX = lanes[currentLane];
        playerX = targetX;
        objects = [];
        D.getElementById('score').innerText = score;

        initBGM();

        if (!loopRunning) {
            loopRunning = true;
            requestAnimationFrame(gameLoop);
        }
    }

    function moveLane(dir) {
        if (!isPlaying) return;
        currentLane += dir;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        targetX = lanes[currentLane];
    }

    function jumpAction() {
        if (isPlaying && !isJumping) {
            isJumping = true;
            jumpV = -16;
        }
    }

    function endGame() {
        isPlaying = false;
        loopRunning = false;
        if (bgmTimer) clearInterval(bgmTimer);
        playHitSE();

        if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('acorn_highscore_v41', highScore); } catch(e) {}
            D.getElementById('high-score').innerText = highScore;
        }

        D.getElementById('res-score').innerText = score;
        var rank = score >= 300 ? 'S' : score >= 200 ? 'A' : score >= 100 ? 'B' : 'C';
        D.getElementById('res-rank').innerText = rank;

        D.getElementById('controls').style.display = 'none';
        D.getElementById('mid-score-board').style.display = 'none';
        D.getElementById('result-screen').style.display = 'flex';

        setTimeout(function() { playResultFanfare(); }, 150);
    }

    window.addEventListener('keydown', function(e) {
        if (!isPlaying) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
        else if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
            jumpAction(); e.preventDefault();
        }
    });

    var timer = 0;
    var speedCounter = 0;
    function gameLoop() {
        if (!isPlaying) return;

        playerX += (targetX - playerX) * 0.35;
        if (isJumping) {
            jumpY += jumpV;
            jumpV += 0.95;
            if (jumpY >= 0) { jumpY = 0; isJumping = false; }
        }

        bgY = (bgY + speed) % 140;

        timer++;
        if (timer > 20) {
            var lane = Math.floor(Math.random() * 3);
            var isEnemy = Math.random() < 0.45;
            var enemyType = Math.floor(Math.random() * 3);
            objects.push({ x: lanes[lane], y: -60, enemy: isEnemy, type: enemyType });
            timer = 0;
            speed += 0.008;
            speedCounter++;
            if (speedCounter % 35 === 0) speedUpNotifyTimer = 40;
        }

        // --- 背景描画 ---
        ctx.fillStyle = '#1b4d3e'; ctx.fillRect(0, 0, 400, 700);

        // 小道
        ctx.fillStyle = '#5c4033'; ctx.fillRect(45, 0, 310, 700);
        ctx.strokeStyle = '#3d2817'; ctx.lineWidth = 4; ctx.strokeRect(45, 0, 310, 700);

        // 左右の木々
        ctx.fillStyle = '#14382c';
        for (var py = -140 + bgY; py < 700; py += 140) {
            ctx.beginPath(); ctx.arc(22, py, 35, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(378, py + 70, 35, 0, Math.PI * 2); ctx.fill();
        }

        // 中央線
        ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 4; ctx.setLineDash([20, 25]); ctx.lineDashOffset = -bgY;
        ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 700); ctx.moveTo(250, 0); ctx.lineTo(250, 700); ctx.stroke();
        ctx.setLineDash([]);

        // --- オブジェクト描画 ---
        for (var i = objects.length - 1; i >= 0; i--) {
            var o = objects[i];
            o.y += speed;

            var dx = Math.abs(playerX - o.x);
            var dy = Math.abs((playerY + jumpY) - o.y);
            
            if (dx < 36 && dy < 38) {
                if (o.enemy) {
                    if (jumpY > -20) { endGame(); return; }
                } else {
                    score += 10;
                    D.getElementById('score').innerText = score;
                    playAcornSE();
                    objects.splice(i, 1);
                    continue;
                }
            }

            if (o.enemy) {
                // 障害物/敵（Canvasで描画）
                ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 18, 28, 9, 0, 0, 6.28); ctx.fill();
                
                if (o.type === 0) {
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(o.x - 6, o.y - 2, 12, 22);
                    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(o.x, o.y - 8, 22, Math.PI, 0, false); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(o.x - 10, o.y - 12, 4, 0, Math.PI * 2);
                    ctx.arc(o.x + 8, o.y - 14, 5, 0, Math.PI * 2); ctx.fill();
                } else if (o.type === 1) {
                    ctx.fillStyle = '#455a64'; ctx.beginPath(); ctx.arc(o.x, o.y, 20, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ff5722';
                    ctx.beginPath(); ctx.moveTo(o.x, o.y - 26); ctx.lineTo(o.x - 8, o.y - 15); ctx.lineTo(o.x + 8, o.y - 15); ctx.fill();
                } else {
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(o.x - 6, o.y - 2, 12, 22);
                    ctx.fillStyle = '#7b1fa2'; ctx.beginPath(); ctx.arc(o.x, o.y - 8, 22, Math.PI, 0, false); ctx.fill();
                }
            } else {
                // ドングリ（Canvasで描画）
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 16, 14, 6, 0, 0, 6.28); ctx.fill();
                ctx.fillStyle = '#8d5524'; ctx.beginPath(); ctx.arc(o.x, o.y - 4, 12, Math.PI, 0, false); ctx.fill();
                ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(o.x, o.y + 4, 13, 0, Math.PI, false); ctx.fill();
                ctx.fillStyle = '#ffee55'; ctx.beginPath(); ctx.arc(o.x - 3, o.y + 2, 4, 0, Math.PI * 2); ctx.fill();
            }
            if (o.y > 780) objects.splice(i, 1);
        }

        // --- プレイヤー描画（Canvasで可愛いリス風キャラを描画） ---
        var pDrawY = playerY + jumpY;
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 45, 38, 10, 0, 0, 6.28); ctx.fill();

        // 体
        ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 10, 26, 0, Math.PI * 2); ctx.fill();
        // 耳
        ctx.beginPath(); ctx.arc(playerX - 16, pDrawY - 32, 9, 0, Math.PI * 2);
        ctx.arc(playerX + 16, pDrawY - 32, 9, 0, Math.PI * 2); ctx.fill();
        // 耳の中
        ctx.fillStyle = '#fde68a';
        ctx.beginPath(); ctx.arc(playerX - 16, pDrawY - 32, 5, 0, Math.PI * 2);
        ctx.arc(playerX + 16, pDrawY - 32, 5, 0, Math.PI * 2); ctx.fill();
        // 顔
        ctx.fillStyle = '#fef3c7'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 2, 16, 0, Math.PI * 2); ctx.fill();
        // 目
        ctx.fillStyle = '#111827';
        ctx.beginPath(); ctx.arc(playerX - 7, pDrawY - 12, 3.5, 0, Math.PI * 2);
        ctx.arc(playerX + 7, pDrawY - 12, 3.5, 0, Math.PI * 2); ctx.fill();
        // 鼻
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(playerX, pDrawY - 6, 2, 0, Math.PI * 2); ctx.fill();

        if (speedUpNotifyTimer > 0) {
            speedUpNotifyTimer--;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.95)';
            ctx.font = '900 24px sans-serif';
            ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            ctx.strokeText('⚡ SPEED UP! ⚡', 200, 260); ctx.fillText('⚡ SPEED UP! ⚡', 200, 260);
        }
        if (isPlaying) requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
