<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            background-color: #1a261a; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 420px; height: 100vh; max-height: 800px;
            background: #2b3a28; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* スタート画面 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: 70px; z-index: 50;
        }
        #fallback-title {
            position: absolute; top: 25%; color: #ffd700; font-size: 34px; font-weight: bold;
            text-shadow: 3px 3px 0 #000, 0 0 15px rgba(255,215,0,0.6); text-align: center; width: 100%; z-index: 51;
        }
        .massive-btn {
            width: 85%; padding: 18px; background: linear-gradient(180deg, #ffe600, #ff8800);
            border: 3px solid #ffffff; border-radius: 40px; color: #1a0000; font-size: 22px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 60; cursor: pointer; text-align: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
        }
        .massive-btn:active { transform: scale(0.96); filter: brightness(0.9); }

        /* トップバー & BGMボタン */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; height: 46px;
            background: rgba(20, 35, 20, 0.9); border: 2px solid #ffd700; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
            color: #ffffff; font-size: 14px; font-weight: bold; z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .bgm-btn {
            background: linear-gradient(180deg, #444, #222); border: 1.5px solid #ffd700; color: #ffd700;
            padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        .bgm-btn.active { background: linear-gradient(180deg, #ff8800, #cc5500); color: #fff; }

        canvas { width: 100%; height: 100%; display: block; z-index: 10; }

        /* 操作ボタン */
        #controls {
            position: absolute; bottom: 20px; left: 12px; right: 12px; display: none;
            justify-content: space-between; gap: 10px; z-index: 40;
        }
        .ctrl-btn {
            flex: 1; padding: 18px 0; background: linear-gradient(180deg, #a06836, #5c3818);
            border: 2px solid #ffd700; border-radius: 20px; color: #ffffff; font-weight: bold;
            font-size: 16px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { background: #5c3818; transform: translateY(2px); }

        /* 結果発表画面（背景画像がはっきり透けるように修正） */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50;
        }
        #result-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35); z-index: 1; /* 背景がしっかり見えるよう薄く調整 */
        }
        .result-board {
            position: relative; background: rgba(20, 30, 20, 0.88); border: 3px solid #ffd700; border-radius: 20px;
            padding: 24px 16px; width: 88%; text-align: center; color: #ffffff; margin-bottom: 30px; z-index: 2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(2px);
        }
        #version-tag { position: absolute; top: 68px; left: 14px; color: #ffd700; font-size: 11px; z-index: 99; opacity: 0.8; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="version-tag">v11 BRIGHT & FIXED</div>

    <div id="start-screen">
        <div id="fallback-title">黄金ドングリを集め出せ！</div>
        <div class="massive-btn" onclick="startGame(event)" ontouchstart="startGame(event)">ゲームスタート！</div>
    </div>

    <div id="top-bar">
        <div>ドングリ: <span id="score" style="color:#ffd700; font-size:16px;">0</span></div>
        <div>最高: <span id="high-score" style="color:#fff;">0</span></div>
        <button id="bgmToggleBtn" class="bgm-btn active" onclick="toggleBGM(event)">🎵 BGM: ON</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="ctrl-btn" onclick="moveLane(-1, event)" ontouchstart="moveLane(-1, event)">◀ 左</div>
        <div class="ctrl-btn" onclick="jumpAction(event)" ontouchstart="jumpAction(event)">▲ ジャンプ</div>
        <div class="ctrl-btn" onclick="moveLane(1, event)" ontouchstart="moveLane(1, event)">右 ▶</div>
    </div>

    <div id="result-screen">
        <div class="result-board">
            <div style="font-size: 24px; color: #ffd700; font-weight: bold; text-shadow: 1px 1px 3px #000;">結果発表</div>
            <p style="margin-top:12px; font-size:16px;">押収ドングリ: <span id="res-score" style="font-size:32px; color:#ffd700; font-weight:bold;">0</span> 個</p>
            <div id="res-rank" style="font-size: 56px; color: #ff3333; font-weight: bold; margin: 5px 0; text-shadow: 2px 2px 0 #000;">S</div>
            <p style="font-size: 13px; color: #ffdddd; background: rgba(255,0,0,0.3); padding: 6px; border-radius: 6px; font-weight:bold;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <div class="massive-btn" onclick="startGame(event)" ontouchstart="startGame(event)" style="position:relative; z-index:2; width:88%;">もう一度走る！</div>
    </div>
</div>

<script>
    var D = document;
    var canvas = D.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    var isPlaying = false;
    var loopRunning = false;
    var score = 0;
    var highScore = localStorage.getItem('acorn_highscore_v11') || 0;
    D.getElementById('high-score').innerText = highScore;

    var lanes = [100, 200, 300];
    var currentLane = 1;
    var playerX = 200;
    var playerY = 470;
    var targetX = 200;
    var isJumping = false;
    var jumpY = 0;
    var jumpV = 0;
    var objects = [];
    var speed = 7;
    var bgY = 0;
    var isBgmOn = true;

    // Web Audio API BGM
    var audioCtx = null;
    var bgmTimer = null;
    function initBGM() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (bgmTimer) clearInterval(bgmTimer);
        
        var notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 349.23];
        var bassNotes = [130.81, 164.81, 196.00, 174.61];
        var step = 0;
        
        bgmTimer = setInterval(function() {
            if (!isPlaying || !isBgmOn) return;
            try {
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = notes[step % notes.length];
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.22);

                if (step % 2 === 0) {
                    var bass = audioCtx.createOscillator();
                    var bGain = audioCtx.createGain();
                    bass.type = 'sawtooth';
                    bass.frequency.value = bassNotes[(step / 2) % bassNotes.length];
                    bGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    bGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    bass.connect(bGain); bGain.connect(audioCtx.destination);
                    bass.start(); bass.stop(audioCtx.currentTime + 0.3);
                }
                step++;
            } catch(e) {}
        }, 240);
    }

    function toggleBGM(e) {
        if (e) e.preventDefault();
        isBgmOn = !isBgmOn;
        var btn = D.getElementById('bgmToggleBtn');
        if (isBgmOn) {
            btn.innerText = "🎵 BGM: ON";
            btn.className = "bgm-btn active";
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } else {
            btn.innerText = "🔇 BGM: OFF";
            btn.className = "bgm-btn";
        }
    }

    // 画像透過処理
    function makeTransparent(img, callback) {
        var tempC = document.createElement('canvas');
        tempC.width = img.width;
        tempC.height = img.height;
        var tempCtx = tempC.getContext('2d');
        tempCtx.drawImage(img, 0, 0);
        
        try {
            var imgData = tempCtx.getImageData(0, 0, tempC.width, tempC.height);
            var data = imgData.data;
            for (var i = 0; i < data.length; i += 4) {
                var r = data[i], g = data[i+1], b = data[i+2];
                if ((r > 190 && g > 190 && b > 190) || (Math.abs(r - g) < 15 && Math.abs(g - b) < 15 && r > 160)) {
                    data[i+3] = 0; 
                }
            }
            tempCtx.putImageData(imgData, 0, 0);
            var newImg = new Image();
            newImg.onload = function() { callback(newImg); };
            newImg.src = tempC.toDataURL();
        } catch(e) {
            callback(img);
        }
    }

    var cleanPlayerImg = null;
    var cleanAcornImg = null;

    var imgTitle = new Image(); imgTitle.src = '1788702691552.png';
    var imgResult = new Image(); imgResult.src = '1788793217973.png';
    
    var imgPlayer = new Image();
    imgPlayer.crossOrigin = 'anonymous';
    imgPlayer.src = '1788793264451.png';
    imgPlayer.onload = function() {
        makeTransparent(imgPlayer, function(res) { cleanPlayerImg = res; });
    };

    var imgAcorn = new Image();
    imgAcorn.crossOrigin = 'anonymous';
    imgAcorn.src = 'image.png';
    imgAcorn.onload = function() {
        makeTransparent(imgAcorn, function(res) { cleanAcornImg = res; });
    };

    imgTitle.onload = function() {
        D.getElementById('start-screen').style.backgroundImage = "url('" + imgTitle.src + "')";
        D.getElementById('fallback-title').style.display = "none";
    };
    imgResult.onload = function() {
        D.getElementById('result-screen').style.backgroundImage = "url('" + imgResult.src + "')";
    };

    function startGame(e) {
        if (e) e.preventDefault();
        if (isPlaying) return;

        D.getElementById('start-screen').style.display = 'none';
        D.getElementById('result-screen').style.display = 'none';
        D.getElementById('controls').style.display = 'flex';

        isPlaying = true;
        score = 0;
        speed = 7;
        currentLane = 1;
        targetX = lanes[currentLane];
        playerX = targetX;
        objects = [];
        D.getElementById('score').innerText = score;

        initBGM();

        if (!loopRunning) {
            loopRunning = true;
            requestAnimationFrame(gameLoop);
        }
    }

    function moveLane(dir, e) {
        if (e) e.preventDefault();
        if (!isPlaying) return;
        currentLane += dir;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        targetX = lanes[currentLane];
    }

    function jumpAction(e) {
        if (e) e.preventDefault();
        if (isPlaying && !isJumping) {
            isJumping = true;
            jumpV = -15;
        }
    }

    function endGame() {
        isPlaying = false;
        loopRunning = false;
        if (bgmTimer) clearInterval(bgmTimer);

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('acorn_highscore_v11', highScore);
            D.getElementById('high-score').innerText = highScore;
        }

        D.getElementById('res-score').innerText = score;
        var rank = score >= 300 ? 'S' : score >= 200 ? 'A' : score >= 100 ? 'B' : 'C';
        D.getElementById('res-rank').innerText = rank;

        D.getElementById('controls').style.display = 'none';
        D.getElementById('result-screen').style.display = 'flex';
    }

    var timer = 0;
    function gameLoop() {
        if (!isPlaying) return;

        playerX += (targetX - playerX) * 0.3;
        if (isJumping) {
            jumpY += jumpV;
            jumpV += 0.85;
            if (jumpY >= 0) { jumpY = 0; isJumping = false; }
        }

        bgY = (bgY + speed) % 100;

        timer++;
        if (timer > 22) {
            var lane = Math.floor(Math.random() * 3);
            var isEnemy = Math.random() < 0.42;
            objects.push({ x: lanes[lane], y: -60, enemy: isEnemy });
            timer = 0;
            speed += 0.005;
        }

        // --- 描画処理：明るく美しい森林小道のグラフィック ---
        // 両サイド：明るい緑の森
        ctx.fillStyle = '#3a6632'; ctx.fillRect(0, 0, 400, 700);
        
        // 中央：明るい土の小道
        ctx.fillStyle = '#a67c52'; ctx.fillRect(50, 0, 300, 700);
        ctx.strokeStyle = '#e6c280'; ctx.lineWidth = 4; ctx.strokeRect(50, 0, 300, 700);

        // レーン区切り（クッキリ見やすい黄色破線）
        ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.setLineDash([25, 25]); ctx.lineDashOffset = -bgY;
        ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 700); ctx.moveTo(250, 0); ctx.lineTo(250, 700); ctx.stroke();
        ctx.setLineDash([]);

        // 両端の警報ランプポスト（視認性の高い見張り台）
        var postOffset = bgY % 120;
        for (var pyPos = -100; pyPos < 800; pyPos += 120) {
            var curY = pyPos + postOffset;
            // 左ポスト
            ctx.fillStyle = '#444'; ctx.fillRect(8, curY, 34, 50);
            ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(25, curY + 20, 10, 0, Math.PI * 2); ctx.fill();
            // 右ポスト
            ctx.fillStyle = '#444'; ctx.fillRect(358, curY, 34, 50);
            ctx.fillStyle = '#3388ff'; ctx.beginPath(); ctx.arc(375, curY + 20, 10, 0, Math.PI * 2); ctx.fill();
        }

        // オブジェクト処理
        for (var i = objects.length - 1; i >= 0; i--) {
            var o = objects[i];
            o.y += speed;

            var dx = Math.abs(playerX - o.x);
            var dy = Math.abs((playerY + jumpY) - o.y);
            
            if (dx < 38 && dy < 45) {
                if (o.enemy) {
                    if (jumpY > -25) { endGame(); return; }
                } else {
                    score += 10;
                    D.getElementById('score').innerText = score;
                    objects.splice(i, 1);
                    continue;
                }
            }

            if (o.enemy) {
                // 新・障害物：森の世界観にマッチした立体的な「苔むした大岩 ＆ 警告ステッカー」
                // 影
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(o.x, o.y + 18, 34, 10, 0, 0, 6.28); ctx.fill();
                // 岩の本体
                ctx.fillStyle = '#6e7b6e'; ctx.beginPath(); ctx.arc(o.x, o.y, 28, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#8a9a8a'; ctx.beginPath(); ctx.arc(o.x - 6, o.y - 6, 18, 0, Math.PI * 2); ctx.fill();
                // 苔の装飾
                ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(o.x + 8, o.y - 12, 10, 0, Math.PI * 2); ctx.fill();
                // 警告標識
                ctx.fillStyle = '#ff2222'; ctx.fillRect(o.x - 14, o.y - 6, 28, 12);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('STOP', o.x, o.y + 3);
            } else {
                // 黄金ドングリ（完全透過）
                var drawAcornImg = cleanAcornImg || imgAcorn;
                ctx.drawImage(drawAcornImg, o.x - 28, o.y - 28, 56, 56);
            }

            if (o.y > 780) objects.splice(i, 1);
        }

        // プレイヤー（ウリボ ＆ おばあちゃん）
        var pDrawY = playerY + jumpY;
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 52, 40, 12, 0, 0, 6.28); ctx.fill();

        var drawPlayerImg = cleanPlayerImg || imgPlayer;
        ctx.drawImage(drawPlayerImg, playerX - 65, pDrawY - 75, 130, 130);

        if (isPlaying) requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
