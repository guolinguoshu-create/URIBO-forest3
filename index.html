<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄金ドングリを集め出せ！</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            max-height: 800px;
            background: linear-gradient(180deg, #1b2618 0%, #2a3a24 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }

        #sound-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 50;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700;
            color: #fff;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* ① トップ画面 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1b2618;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 70px;
            z-index: 30;
        }
        #start-header-card {
            background: rgba(0, 0, 0, 0.82);
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 18px;
            width: 90%;
            text-align: center;
            color: #ffffff;
            margin-bottom: auto;
            margin-top: 60px;
        }
        #start-header-card h1 { font-size: 22px; color: #ffd700; margin-bottom: 6px; }
        
        #start-btn {
            width: 85%;
            padding: 18px;
            background: linear-gradient(180deg, #ffea00, #ff8800);
            border: 3px solid #ffffff;
            border-radius: 35px;
            color: #000;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7);
            animation: pulse 1.5s infinite;
            touch-action: manipulation;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

        /* スコアバー */
        #top-bar {
            position: absolute;
            top: 12px; left: 12px; right: 64px; height: 42px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            z-index: 10;
        }
        .score-text { color: #ffd700; font-size: 16px; }

        canvas { width: 100%; height: 100%; display: block; }

        /* 操作ボタン */
        #controls {
            position: absolute;
            bottom: 20px; left: 12px; right: 12px;
            display: none;
            justify-content: space-between;
            gap: 10px;
            z-index: 20;
        }
        .btn {
            flex: 1; padding: 16px 0;
            background: linear-gradient(180deg, #9a6332, #5c3a17);
            border: 2px solid #ffd700;
            border-radius: 25px;
            color: #ffffff; font-weight: bold; font-size: 16px;
            text-align: center; cursor: pointer; touch-action: manipulation;
        }

        /* ③ 結果発表画面 */
        #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 30;
        }
        .result-board {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            border: 3px solid #ffd700;
            border-radius: 18px;
            padding: 22px 16px;
            width: 90%;
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .result-title { font-size: 24px; color: #ffd700; margin-bottom: 12px; font-weight: bold; }
        .rank-badge { font-size: 48px; color: #ff4444; font-weight: bold; margin: 4px 0; }
        #restart-btn {
            width: 85%; padding: 16px;
            background: linear-gradient(180deg, #ffea00, #ff8800);
            border: 3px solid #ffffff; border-radius: 30px;
            color: #000; font-size: 20px; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="sound-btn" onclick="toggleSound()">🔊</button>

    <!-- ① スタート画面 -->
    <div id="start-screen">
        <div id="start-header-card">
            <h1>黄金ドングリを集め出せ！</h1>
            <p>警察に見つかる前にどんぐりを集めよう！</p>
        </div>
        <button id="start-btn" onclick="startGame()">スタート！</button>
    </div>

    <!-- UIバー -->
    <div id="top-bar">
        <div>黄金ドングリ: <span id="score" class="score-text">0</span> 個</div>
        <div>最高: <span id="high-score">0</span></div>
    </div>

    <!-- ゲーム描画 -->
    <canvas id="gameCanvas"></canvas>

    <!-- ② プレイ中のボタン -->
    <div id="controls">
        <div class="btn" id="btn-left">◀ 左</div>
        <div class="btn" id="btn-jump">▲ ジャンプ</div>
        <div class="btn" id="btn-right">右 ▶</div>
    </div>

    <!-- ③ 結果画面 -->
    <div id="result-screen">
        <div class="result-board">
            <div class="result-title">【 結 果 発 表 】</div>
            <p style="font-size:14px; color:#ddd;">押収された黄金ドングリ</p>
            <div style="font-size: 26px; color: #ffd700; margin: 6px 0; font-weight:bold;"><span id="res-score">0</span> 個</div>
            <p style="font-size:14px; color:#ddd; margin-top:8px;">評価ランク</p>
            <div id="res-rank" class="rank-badge">S</div>
            <p style="font-size: 11px; margin-top: 8px; color: #aaa;">罪状：どんぐり大量無許可占有罪</p>
        </div>
        <button id="restart-btn" onclick="resetGame()">もう一度走る！</button>
    </div>
</div>

<script>
    // ==========================================
    // 🖼️ 画像自動設定システム (背景透過機能つき)
    // ==========================================
    const IMAGE_CANDIDATES = [
        '1788793217973.png', // トップ画像（前回と入れ替えました！）
        '1788702691552.png', // おばあちゃん（前回と入れ替えました！）
        '1788793264451.png', // 結果発表
        'image.png',         // ドングリ
        'title.png', 'player.png', 'result.png', 'acorn.png'
    ];

    const loadedImages = {};
    let playerImgObj = null;
    let acornImgObj = null;

    function initImages() {
        let loadedCount = 0;
        IMAGE_CANDIDATES.forEach(filename => {
            const img = new Image();
            img.crossOrigin = "Anonymous"; // 透過処理のために必要
            img.onload = () => { loadedImages[filename] = img; checkDone(); };
            img.onerror = () => { checkDone(); };
            img.src = filename;
        });

        function checkDone() {
            loadedCount++;
            if (loadedCount === IMAGE_CANDIDATES.length) applyLoadedImages();
        }
    }

    function applyLoadedImages() {
        // トップ画像 (ファイル名を入れ替え)
        const titleImg = loadedImages['title.png'] || loadedImages['1788793217973.png'];
        if (titleImg) {
            document.getElementById('start-screen').style.backgroundImage = `url('${titleImg.src}')`;
            document.getElementById('start-header-card').style.display = 'none';
        }
        
        // おばあちゃん (ファイル名を入れ替え)
        playerImgObj = loadedImages['player.png'] || loadedImages['1788702691552.png'];
        
        // 結果画面
        const resultImg = loadedImages['result.png'] || loadedImages['1788793264451.png'];
        if (resultImg) {
            document.getElementById('result-screen').style.backgroundImage = `url('${resultImg.src}')`;
        }
        
        // 黄金ドングリ ＆ 背景自動透過処理！
        const rawAcorn = loadedImages['acorn.png'] || loadedImages['image.png'];
        if (rawAcorn && rawAcorn.complete && rawAcorn.naturalWidth !== 0) {
            try {
                // 画像を仮想キャンバスに描画して、白っぽい色を透明に変換する
                const tCanvas = document.createElement('canvas');
                tCanvas.width = rawAcorn.naturalWidth;
                tCanvas.height = rawAcorn.naturalHeight;
                const tCtx = tCanvas.getContext('2d');
                tCtx.drawImage(rawAcorn, 0, 0);
                const imgData = tCtx.getImageData(0, 0, tCanvas.width, tCanvas.height);
                const data = imgData.data;
                
                for(let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];
                    // 白っぽい背景 (R,G,Bがすべて230以上) なら透明にする
                    if(r > 230 && g > 230 && b > 230) {
                        data[i+3] = 0; // 透明度(Alpha)を0に
                    }
                    // ついでに真っ黒背景の場合も透明にする
                    if(r < 20 && g < 20 && b < 20) {
                        data[i+3] = 0;
                    }
                }
                tCtx.putImageData(imgData, 0, 0);
                acornImgObj = tCanvas; // 透過済みのキャンバスをセット
            } catch(e) {
                // セキュリティエラー等で透過できない場合はそのまま使う
                acornImgObj = rawAcorn;
            }
        }
    }

    initImages();

    // ==========================================
    // 🎵 フリーズ対策済み サウンドシステム
    // ==========================================
    class SoundManager {
        constructor() { this.ctx = null; this.muted = false; }
        init() {
            try {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            } catch(e) { this.muted = true; }
        }
        playTone(freq, type, duration, vol=0.1) {
            try {
                this.init();
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            } catch(e) {}
        }
        playJump() { this.playTone(400, 'sine', 0.15, 0.1); }
        playCoin() { this.playTone(987, 'sine', 0.08, 0.15); setTimeout(() => this.playTone(1318, 'sine', 0.15, 0.15), 60); }
        playGameOver() { this.playTone(220, 'sawtooth', 0.5, 0.2); }
    }
    const sound = new SoundManager();
    function toggleSound() {
        sound.muted = !sound.muted;
        document.getElementById('sound-btn').textContent = sound.muted ? '🔇' : '🔊';
    }

    // ==========================================
    // 🎮 ゲームシステム
    // ==========================================
    function setGameState(state) {
        const s = document.getElementById('start-screen');
        const r = document.getElementById('result-screen');
        const c = document.getElementById('controls');
        if (state === 'START') { s.style.display = 'flex'; r.style.display = 'none'; c.style.display = 'none'; }
        else if (state === 'PLAYING') { s.style.display = 'none'; r.style.display = 'none'; c.style.display = 'flex'; }
        else if (state === 'RESULT') { s.style.display = 'none'; r.style.display = 'flex'; c.style.display = 'none'; }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 700;

    let score = 0;
    let highScore = 0;
    try { highScore = localStorage.getItem('acorn_highscore') || 0; } catch(e) {}
    document.getElementById('high-score').textContent = highScore;

    let isGameOver = false; let isPlaying = false;
    const lanes = [100, 200, 300];
    let currentLane = 1; let targetX = lanes[currentLane];
    let playerX = targetX; let playerY = 530;
    let isJumping = false; let jumpOffsetY = 0; let jumpVelocity = 0;
    const gravity = 0.85;
    let objects = []; let speed = 7; let spawnTimer = 0; let bgOffset = 0;

    document.getElementById('btn-left').addEventListener('click', () => moveLane(-1));
    document.getElementById('btn-right').addEventListener('click', () => moveLane(1));
    document.getElementById('btn-jump').addEventListener('click', jump);

    function moveLane(dir) {
        if (!isPlaying || isGameOver) return;
        currentLane = Math.max(0, Math.min(2, currentLane + dir));
        targetX = lanes[currentLane];
    }
    function jump() {
        if (isPlaying && !isJumping && !isGameOver) {
            isJumping = true; jumpVelocity = -15; sound.playJump();
        }
    }

    function startGame() {
        try { sound.init(); } catch(e) {}
        isPlaying = true; isGameOver = false;
        setGameState('PLAYING');
        gameLoop();
    }

    function spawnObject() {
        const lane = Math.floor(Math.random() * 3);
        const isObstacle = Math.random() < 0.35;
        objects.push({ x: lanes[lane], y: -50, type: isObstacle ? 'rock' : 'acorn' });
    }

    function update() {
        if (!isPlaying || isGameOver) return;
        playerX += (targetX - playerX) * 0.25;

        if (isJumping) {
            jumpOffsetY += jumpVelocity; jumpVelocity += gravity;
            if (jumpOffsetY >= 0) { jumpOffsetY = 0; isJumping = false; }
        }
        bgOffset = (bgOffset + speed) % 40;
        spawnTimer++;
        if (spawnTimer > 30) { spawnObject(); spawnTimer = 0; speed += 0.003; }

        for (let i = objects.length - 1; i >= 0; i--) {
            let obj = objects[i]; obj.y += speed;
            let dx = Math.abs(playerX - obj.x);
            let dy = Math.abs((playerY + jumpOffsetY) - obj.y);

            if (dx < 32 && dy < 38) {
                if (obj.type === 'acorn') {
                    score += 10; document.getElementById('score').textContent = score;
                    sound.playCoin(); objects.splice(i, 1); continue;
                } else if (obj.type === 'rock') {
                    if (jumpOffsetY > -25) { endGame(); return; }
                }
            }
            if (obj.y > canvas.height + 50) objects.splice(i, 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景
        ctx.fillStyle = '#2d3725'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#5a4332'; ctx.fillRect(50, 0, 300, canvas.height);
        ctx.strokeStyle = '#8d7052'; ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -bgOffset; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(150, 0); ctx.lineTo(150, canvas.height);
        ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height); ctx.stroke(); ctx.setLineDash([]);

        // オブジェクト
        objects.forEach(obj => {
            if (obj.type === 'acorn') {
                if (acornImgObj) {
                    // 透過処理済みのドングリを描画
                    ctx.drawImage(acornImgObj, obj.x - 24, obj.y - 24, 48, 48);
                } else {
                    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(obj.x, obj.y, 14, 0, Math.PI * 2); ctx.fill();
                }
            } else {
                ctx.fillStyle = '#6c7a89'; ctx.beginPath(); ctx.arc(obj.x, obj.y, 22, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#34495e'; ctx.fillRect(obj.x - 16, obj.y - 6, 32, 12);
            }
        });

        // プレイヤー描画
        const drawY = playerY + jumpOffsetY;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(playerX, playerY + 40, 28, 10, 0, 0, Math.PI * 2); ctx.fill();

        if (playerImgObj && playerImgObj.complete && playerImgObj.naturalWidth !== 0) {
            const w = 120; const h = 180;
            ctx.drawImage(playerImgObj, playerX - w/2, drawY - h + 30, w, h);
        } else {
            ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(playerX, drawY, 26, 0, Math.PI * 2); ctx.fill();
        }
    }

    function gameLoop() {
        update(); draw();
        if (isPlaying && !isGameOver) requestAnimationFrame(gameLoop);
    }

    function endGame() {
        isGameOver = true; isPlaying = false; sound.playGameOver();
        try {
            if (score > highScore) {
                highScore = score; localStorage.setItem('acorn_highscore', highScore);
                document.getElementById('high-score').textContent = highScore;
            }
        } catch(e) {}

        let rank = 'C';
        if (score >= 300) rank = 'S'; else if (score >= 200) rank = 'A'; else if (score >= 100) rank = 'B';
        document.getElementById('res-score').textContent = score;
        document.getElementById('res-rank').textContent = rank;
        setGameState('RESULT');
    }

    function resetGame() {
        score = 0; speed = 7; currentLane = 1; targetX = lanes[1]; playerX = targetX; objects = [];
        document.getElementById('score').textContent = 0; startGame();
    }

    setGameState('START');
</script>
</body>
</html>
